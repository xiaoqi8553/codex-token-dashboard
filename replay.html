<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Work Replay</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Cpath d='M18 22l10 10-10 10' fill='none' stroke='%2322d3ee' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M32 42h14' fill='none' stroke='%23edf4ff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d12;
      --panel: rgba(17, 24, 39, .82);
      --panel-2: rgba(30, 41, 59, .72);
      --line: rgba(148, 163, 184, .22);
      --text: #edf4ff;
      --muted: #9fb1c7;
      --blue: #3b82f6;
      --green: #10b981;
      --gray: #94a3b8;
      --orange: #f59e0b;
      --red: #f43f5e;
      --cyan: #22d3ee;
      --violet: #8b5cf6;
      --radius: 18px;
      font-family: "Aptos", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(59,130,246,.24), transparent 32%),
        radial-gradient(circle at 78% 18%, rgba(16,185,129,.18), transparent 28%),
        linear-gradient(135deg, #090d12, #0f172a 54%, #07111b);
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(to bottom, black, transparent 88%);
    }
    button, select {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(15, 23, 42, .72);
      color: var(--text);
      padding: 7px 11px;
      font: inherit;
    }
    button { cursor: pointer; }
    button:hover { border-color: rgba(237,244,255,.42); }
    button.primary { background: #edf4ff; color: #0f172a; border-color: #edf4ff; font-weight: 800; }
    a { color: inherit; text-decoration: none; }
    .app { width: min(1500px, calc(100vw - 28px)); margin: 0 auto; padding: 18px 0 28px; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(9, 13, 18, .74);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 12px;
      z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      color: white;
      font-weight: 900;
      box-shadow: 0 12px 40px rgba(34,211,238,.25);
    }
    h1 { margin: 0; font-size: clamp(24px, 2.4vw, 38px); line-height: 1; letter-spacing: 0; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .toolbar { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .hero {
      margin-top: 14px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 14px;
      align-items: stretch;
    }
    .stage, .side, .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 80px rgba(0,0,0,.22);
    }
    .stage {
      min-height: 540px;
      position: relative;
      overflow: hidden;
      padding: 24px;
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: 36px;
      border: 1px solid rgba(148,163,184,.14);
      border-radius: 50%;
      transform: rotate(-8deg);
    }
    .stage::after {
      content: "";
      position: absolute;
      width: 460px;
      height: 460px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59,130,246,.2), rgba(34,211,238,.08) 42%, transparent 68%);
      filter: blur(4px);
    }
    .scene-title { position: relative; z-index: 2; display: flex; justify-content: space-between; gap: 16px; }
    .scene-title h2 { margin: 0; font-size: clamp(28px, 4vw, 62px); line-height: .95; }
    .scene-title p { color: var(--muted); margin: 10px 0 0; max-width: 620px; line-height: 1.55; }
    .metric-strip { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 22px; }
    .mini {
      padding: 12px;
      border: 1px solid rgba(148,163,184,.18);
      border-radius: 14px;
      background: rgba(15,23,42,.52);
    }
    .mini span { color: var(--muted); font-size: 12px; display: block; }
    .mini strong { display: block; margin-top: 6px; font-size: 24px; line-height: 1; }
    .orbit {
      position: absolute;
      inset: 160px 38px 34px;
      z-index: 3;
    }
    .node {
      position: absolute;
      width: var(--size);
      height: var(--size);
      left: var(--x);
      top: var(--y);
      transform: translate(-50%, -50%);
      border-radius: 999px;
      border: 2px solid var(--source);
      background:
        radial-gradient(circle at 34% 30%, rgba(255,255,255,.82), transparent 14%),
        radial-gradient(circle, var(--task), rgba(15,23,42,.92) 68%);
      box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 0 calc(var(--size) * .9) color-mix(in srgb, var(--task) 52%, transparent);
      opacity: .38;
      transition: transform 220ms ease, opacity 220ms ease, filter 220ms ease;
    }
    .node.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.25);
      filter: saturate(1.25);
      z-index: 4;
    }
    .node.past { opacity: .72; }
    .beam {
      position: absolute;
      left: 10%;
      right: 10%;
      bottom: 42px;
      height: 3px;
      z-index: 3;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--blue), var(--green), var(--orange), var(--red));
      transform-origin: left;
      transform: scaleX(var(--progress, .02));
      box-shadow: 0 0 22px rgba(59,130,246,.36);
    }
    .side { padding: 14px; display: grid; gap: 12px; align-content: start; }
    .current-card { border: 1px solid var(--line); border-radius: 16px; padding: 14px; background: rgba(15,23,42,.72); min-height: 220px; }
    .current-card h3 { margin: 0; font-size: 18px; line-height: 1.25; overflow-wrap: anywhere; }
    .current-card .time { color: var(--muted); margin: 8px 0 12px; font-size: 13px; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
    .badge { border: 1px solid var(--line); border-radius: 999px; padding: 4px 8px; color: var(--muted); font-size: 12px; font-weight: 800; }
    .badge.official_plus { color: #7db0ff; }
    .badge.relay { color: #60d7c4; }
    .badge.unknown { color: #cbd5e1; }
    .rows { display: grid; gap: 8px; }
    .row { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 13px; }
    .row strong { color: var(--text); }
    .timeline {
      max-height: 364px;
      overflow: auto;
      display: grid;
      gap: 7px;
      padding-right: 2px;
    }
    .event-card {
      border: 1px solid rgba(148,163,184,.14);
      border-radius: 13px;
      background: rgba(15,23,42,.48);
      padding: 9px;
      display: grid;
      grid-template-columns: 70px 1fr auto;
      gap: 8px;
      align-items: center;
      text-align: left;
      width: 100%;
      min-width: 0;
    }
    .event-card.active { border-color: rgba(237,244,255,.5); background: rgba(59,130,246,.16); }
    .event-card span { min-width: 0; }
    .event-card .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .legend { display: flex; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; background: var(--color); }
    .lower { margin-top: 14px; display: grid; grid-template-columns: 1.05fr .95fr; gap: 14px; }
    .panel { padding: 16px; }
    .panel h2 { margin: 0 0 12px; font-size: 20px; }
    .bars { display: grid; gap: 10px; }
    .bar { display: grid; grid-template-columns: 110px minmax(0,1fr) 84px; gap: 10px; align-items: center; font-size: 13px; }
    .track { height: 10px; border-radius: 999px; background: rgba(148,163,184,.14); overflow: hidden; }
    .fill { height: 100%; width: var(--w); background: linear-gradient(90deg, var(--blue), var(--cyan)); border-radius: inherit; }
    .empty { color: var(--muted); padding: 30px; text-align: center; border: 1px dashed var(--line); border-radius: 16px; }
    @media (max-width: 1100px) {
      .hero, .lower { grid-template-columns: 1fr; }
      .stage { min-height: 600px; }
    }
    @media (max-width: 640px) {
      .app { width: min(100vw - 16px, 1500px); padding-top: 8px; }
      .topbar { position: static; align-items: flex-start; }
      .toolbar { justify-content: flex-start; }
      .metric-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .event-card { grid-template-columns: 56px 1fr; }
      .event-card > span:last-child { grid-column: 2; justify-self: start; }
      .stage { min-height: 620px; padding: 16px; }
      .orbit { inset: 218px 18px 46px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark">CR</div>
        <div>
          <h1>Codex Work Replay</h1>
          <div class="sub" id="sourceText">正在读取数据...</div>
        </div>
      </div>
      <div class="toolbar">
        <select id="rangeSelect" aria-label="回放范围">
          <option value="today">今天</option>
          <option value="7d" selected>最近 7 天</option>
          <option value="30d">最近 30 天</option>
          <option value="all">全部</option>
        </select>
        <button id="playBtn" class="primary" type="button">播放</button>
        <button id="speedBtn" type="button">1x</button>
        <button id="exportBtn" type="button">导出总结</button>
        <a href="index.html"><button type="button">返回看板</button></a>
      </div>
    </header>

    <section class="hero">
      <div class="stage">
        <div class="scene-title">
          <div>
            <h2>把 AI 协作过程播放出来</h2>
            <p id="storyText">回放会把每个 session 聚合成事件节点。节点越大，Token 越多；颜色代表任务类型；边框代表官方 Plus / 中转站 / 未知来源。</p>
          </div>
        </div>
        <div class="metric-strip" id="metricStrip"></div>
        <div class="orbit" id="orbit"></div>
        <div class="beam" id="beam"></div>
      </div>
      <aside class="side">
        <div class="current-card" id="currentCard"></div>
        <div class="legend" id="legend"></div>
        <div class="timeline" id="timeline"></div>
      </aside>
    </section>

    <section class="lower">
      <article class="panel">
        <h2>任务类型能量</h2>
        <div class="bars" id="taskBars"></div>
      </article>
      <article class="panel">
        <h2>回放总结</h2>
        <div class="rows" id="summaryRows"></div>
      </article>
    </section>
  </main>

  <script>
    const els = {
      sourceText: document.querySelector("#sourceText"),
      metricStrip: document.querySelector("#metricStrip"),
      orbit: document.querySelector("#orbit"),
      beam: document.querySelector("#beam"),
      currentCard: document.querySelector("#currentCard"),
      timeline: document.querySelector("#timeline"),
      legend: document.querySelector("#legend"),
      taskBars: document.querySelector("#taskBars"),
      summaryRows: document.querySelector("#summaryRows"),
      rangeSelect: document.querySelector("#rangeSelect"),
      playBtn: document.querySelector("#playBtn"),
      speedBtn: document.querySelector("#speedBtn"),
      exportBtn: document.querySelector("#exportBtn")
    };

    const sourceLabels = { official_plus: "官方 Plus", relay: "中转站", unknown: "未知" };
    const sourceColors = { official_plus: "#3b82f6", relay: "#10b981", unknown: "#94a3b8" };
    const taskTypes = [
      { id: "debug", label: "调试报错", color: "#f43f5e", priority: 92, keywords: ["debug", "bug", "error", "failed", "failure", "stack trace", "exception", "traceback", "报错", "修复报错", "异常", "失败", "错误", "崩溃", "排错"] },
      { id: "deploy", label: "部署 / 运维", color: "#f59e0b", priority: 88, keywords: ["deploy", "deployment", "netlify", "vercel", "github pages", "github actions", "ci", "build", "server", "port", "npm", "部署", "发布", "运维", "端口", "启动", "构建", "上线"] },
      { id: "frontend", label: "前端 UI", color: "#22d3ee", priority: 82, keywords: ["ui", "ux", "frontend", "layout", "button", "chart", "page", "dashboard", "visual", "responsive", "界面", "页面", "视觉", "样式", "布局", "前端", "按钮", "图表", "看板", "暗色", "明细表"] },
      { id: "docs", label: "文档 / README", color: "#8b5cf6", priority: 78, keywords: ["readme", "docs", "document", "markdown", "article", "changelog", "release", "文档", "说明", "文章", "更新日志", "公众号", "总结", "复盘", "开源展示"] },
      { id: "data", label: "数据分析", color: "#06b6d4", priority: 74, keywords: ["data", "token", "csv", "json", "chart", "table", "analytics", "usage", "统计", "数据", "分析", "图表", "表格", "导入", "导出", "缓存命中"] },
      { id: "planning", label: "项目规划", color: "#eab308", priority: 70, keywords: ["roadmap", "plan", "architecture", "design", "proposal", "规划", "计划", "方案", "架构", "设计", "建议", "计划表", "重大飞跃"] },
      { id: "refactor", label: "重构", color: "#14b8a6", priority: 66, keywords: ["refactor", "cleanup", "extract", "restructure", "重构", "抽象", "整理", "优化结构", "抽离"] },
      { id: "coding", label: "写代码", color: "#60a5fa", priority: 58, keywords: ["function", "class", "component", "module", "api", "test", "implement", "feature", "script", "写代码", "代码实现", "实现功能", "函数", "组件", "接口", "测试"] },
      { id: "other", label: "其他 / 未识别", color: "#94a3b8", keywords: [] }
    ];
    const taskMap = Object.fromEntries(taskTypes.map(type => [type.id, type]));
    let rawRecords = [];
    let events = [];
    let activeIndex = 0;
    let playing = false;
    let timer = null;
    let speed = 1;

    function todayString(offset = 0) {
      const date = new Date();
      date.setDate(date.getDate() + offset);
      return new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    }
    function formatToken(value) {
      const number = Number(value || 0);
      const abs = Math.abs(number);
      const unit = (divisor, suffix, digits) => `${(Math.floor(abs / divisor * 10 ** digits) / 10 ** digits * (number < 0 ? -1 : 1)).toFixed(digits)}${suffix}`;
      if (abs >= 1e9) return unit(1e9, "B", 2);
      if (abs >= 1e6) return unit(1e6, "M", 2);
      if (abs >= 1e3) return unit(1e3, "K", 1);
      return Math.round(number).toLocaleString("zh-CN");
    }
    function formatInt(value) { return Math.round(Number(value || 0)).toLocaleString("zh-CN"); }
    function percent(part, total, digits = 1) { return total ? Number((part / total * 100).toFixed(digits)) : 0; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }
    function isLowValueTitle(value) {
      const text = String(value || "").trim().toLowerCase();
      return !text ||
        text.startsWith("<environment_context>") ||
        text.includes("# agents.md instructions") ||
        text.includes("current_date") ||
        text.includes("<cwd>");
    }
    function activeTokens(record) {
      return Math.max(Number(record.inputTokens || 0) - Number(record.cachedInputTokens || 0), 0) + Number(record.outputTokens || 0);
    }
    function normalizeRecord(raw = {}) {
      const inputTokens = Number(raw.inputTokens ?? raw.input_tokens ?? raw.prompt_tokens ?? raw.input ?? 0);
      const cachedInputTokens = Number(raw.cachedInputTokens ?? raw.cached_input_tokens ?? raw.cached_tokens ?? raw.cached ?? 0);
      const outputTokens = Number(raw.outputTokens ?? raw.output_tokens ?? raw.completion_tokens ?? raw.output ?? 0);
      const totalTokens = Number(raw.totalTokens ?? raw.total_tokens ?? raw.tokens ?? raw.total ?? inputTokens + outputTokens);
      const timestamp = new Date(raw.timestamp || raw.time || raw.date || raw.created_at || Date.now()).toISOString();
      return {
        id: String(raw.id || `${timestamp}-${raw.sessionId || raw.session_id || Math.random()}`),
        timestamp,
        date: timestamp.slice(0, 10),
        sessionId: String(raw.sessionId || raw.session_id || raw.conversation_id || raw.id || "unknown"),
        model: String(raw.model || raw.model_name || "unknown"),
        source: raw.source || "unknown",
        provider: raw.provider || raw.source || "unknown",
        sessionTitle: isLowValueTitle(raw.sessionTitle || raw.title)
          ? (raw.relativePath || raw.relative_path || raw.sessionId || raw.session_id || "未命名会话")
          : (raw.sessionTitle || raw.title || raw.sessionId || raw.session_id || "未命名会话"),
        relativePath: raw.relativePath || raw.relative_path || "",
        detailText: raw.detailText || "",
        inputTokens,
        cachedInputTokens,
        outputTokens,
        totalTokens,
        estimated: Boolean(raw.estimated)
      };
    }
    function escapeRegExp(value) { return String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
    function keywordMatches(text, keyword) {
      const key = String(keyword || "").toLowerCase();
      if (!key) return false;
      if (/^[a-z0-9_.-]+$/.test(key)) return new RegExp(`(^|[^a-z0-9])${escapeRegExp(key)}($|[^a-z0-9])`, "i").test(text);
      return text.includes(key);
    }
    function classifyTask(record) {
      if (record.taskType && taskMap[record.taskType]) return taskMap[record.taskType];
      const title = String(record.sessionTitle || "").toLowerCase();
      const path = [record.relativePath, record.importBatch].filter(Boolean).join(" ").toLowerCase();
      const detail = String(record.detailText || "").toLowerCase().slice(0, 3000);
      let best = taskMap.other;
      let bestScore = 0;
      for (const type of taskTypes) {
        if (type.id === "other") continue;
        let score = 0;
        for (const keyword of type.keywords) {
          if (keywordMatches(title, keyword)) score += 5;
          if (keywordMatches(path, keyword)) score += 3;
          if (keywordMatches(detail, keyword)) score += 1;
        }
        if (score > bestScore || (score === bestScore && score > 0 && (type.priority || 0) > (best.priority || 0))) {
          best = type;
          bestScore = score;
        }
      }
      return best;
    }
    function rangeRecords(records) {
      const range = els.rangeSelect.value;
      if (range === "all") return records;
      const from = range === "today" ? todayString() : range === "30d" ? todayString(-29) : todayString(-6);
      const to = todayString();
      return records.filter(record => record.date >= from && record.date <= to);
    }
    function groupEvents(records) {
      const map = new Map();
      for (const record of records) {
        const key = `${record.date}|${record.sessionId}`;
        if (!map.has(key)) {
          map.set(key, {
            sessionId: record.sessionId,
            title: record.sessionTitle || record.relativePath || record.sessionId,
            timestamp: record.timestamp,
            date: record.date,
            source: record.source || "unknown",
            model: record.model || "unknown",
            records: 0,
            totalTokens: 0,
            inputTokens: 0,
            cachedInputTokens: 0,
            outputTokens: 0,
            activeTokens: 0,
            estimated: false,
            task: classifyTask(record)
          });
        }
        const event = map.get(key);
        event.records += 1;
        event.totalTokens += Number(record.totalTokens || 0);
        event.inputTokens += Number(record.inputTokens || 0);
        event.cachedInputTokens += Number(record.cachedInputTokens || 0);
        event.outputTokens += Number(record.outputTokens || 0);
        event.activeTokens += activeTokens(record);
        event.estimated = event.estimated || record.estimated;
        if (record.timestamp < event.timestamp) event.timestamp = record.timestamp;
        if (event.source === "unknown" && record.source !== "unknown") event.source = record.source;
      }
      return Array.from(map.values()).sort((a, b) => a.timestamp.localeCompare(b.timestamp));
    }
    async function loadData() {
      try {
        const response = await fetch("/api/usage", { cache: "no-store" });
        if (response.ok) {
          const payload = await response.json();
          if (Array.isArray(payload.records)) {
            els.sourceText.textContent = `本地 Node 模式 / ${payload.records.length.toLocaleString("zh-CN")} 条 usage 记录`;
            return payload.records.map(normalizeRecord);
          }
        }
      } catch {}
      try {
        const cached = localStorage.getItem("codexTokenStaticPayload");
        if (cached) {
          const payload = JSON.parse(cached);
          if (Array.isArray(payload.records) && payload.records.length) {
            els.sourceText.textContent = `浏览器导入缓存 / ${payload.records.length.toLocaleString("zh-CN")} 条 usage 记录`;
            return payload.records.map(normalizeRecord);
          }
        }
      } catch {}
      const demo = await fetch("sample-data/demo-usage-index.json", { cache: "no-store" }).then(response => response.json());
      els.sourceText.textContent = `公开示例数据 / ${demo.records.length.toLocaleString("zh-CN")} 条 usage 记录`;
      return demo.records.map(normalizeRecord);
    }
    function summarize(events) {
      return events.reduce((summary, event) => {
        summary.totalTokens += event.totalTokens;
        summary.activeTokens += event.activeTokens;
        summary.cachedInputTokens += event.cachedInputTokens;
        summary.inputTokens += event.inputTokens;
        summary.outputTokens += event.outputTokens;
        summary.sessions += 1;
        summary.sources[event.source] = (summary.sources[event.source] || 0) + event.totalTokens;
        summary.tasks[event.task.id] = summary.tasks[event.task.id] || { ...event.task, totalTokens: 0, sessions: 0 };
        summary.tasks[event.task.id].totalTokens += event.totalTokens;
        summary.tasks[event.task.id].sessions += 1;
        return summary;
      }, { totalTokens: 0, activeTokens: 0, cachedInputTokens: 0, inputTokens: 0, outputTokens: 0, sessions: 0, sources: {}, tasks: {} });
    }
    function render() {
      events = groupEvents(rangeRecords(rawRecords));
      activeIndex = Math.min(activeIndex, Math.max(events.length - 1, 0));
      const summary = summarize(events);
      const max = Math.max(...events.map(event => event.totalTokens), 1);
      els.metricStrip.innerHTML = [
        ["总 Token", formatToken(summary.totalTokens)],
        ["session 事件", formatInt(summary.sessions)],
        ["active tokens", formatToken(summary.activeTokens)],
        ["缓存命中率", `${percent(summary.cachedInputTokens, summary.inputTokens)}%`]
      ].map(([label, value]) => `<div class="mini"><span>${label}</span><strong>${value}</strong></div>`).join("");
      els.orbit.innerHTML = events.length ? events.map((event, index) => {
        const angle = events.length === 1 ? 0 : (index / Math.max(events.length - 1, 1)) * Math.PI * 1.72 - Math.PI * .86;
        const radiusX = 42;
        const radiusY = 38;
        const x = 50 + Math.cos(angle) * radiusX;
        const y = 52 + Math.sin(angle) * radiusY;
        const size = Math.max(16, Math.min(70, 16 + (event.totalTokens / max) * 54));
        const cls = index === activeIndex ? "active" : index < activeIndex ? "past" : "";
        return `<button class="node ${cls}" data-index="${index}" title="${escapeHtml(event.title)} / ${formatToken(event.totalTokens)}" style="--x:${x}%;--y:${y}%;--size:${size}px;--task:${event.task.color};--source:${sourceColors[event.source] || sourceColors.unknown}" type="button"></button>`;
      }).join("") : `<div class="empty">当前范围没有可回放的 usage 记录。</div>`;
      els.beam.style.setProperty("--progress", events.length ? String((activeIndex + 1) / events.length) : "0.02");
      els.timeline.innerHTML = events.map((event, index) => `
        <button class="event-card ${index === activeIndex ? "active" : ""}" data-index="${index}" type="button">
          <span>${event.timestamp.slice(5, 16).replace("T", " ")}</span>
          <span class="title">${escapeHtml(event.title)}</span>
          <span>${formatToken(event.totalTokens)}</span>
        </button>
      `).join("") || `<div class="empty">暂无事件。请回到主看板导入 sessions 文件夹。</div>`;
      els.legend.innerHTML = taskTypes.filter(type => type.id !== "other").map(type => `<span><i class="dot" style="--color:${type.color}"></i>${type.label}</span>`).join("");
      renderCurrent();
      renderLower(summary);
    }
    function renderCurrent() {
      const event = events[activeIndex];
      if (!event) {
        els.currentCard.innerHTML = `<div class="empty">没有可展示的事件。</div>`;
        return;
      }
      els.currentCard.innerHTML = `
        <h3>${escapeHtml(event.title)}</h3>
        <div class="time">${escapeHtml(event.timestamp.replace("T", " ").slice(0, 16))}</div>
        <div class="badges">
          <span class="badge">${escapeHtml(event.task.label)}</span>
          <span class="badge ${event.source}">${sourceLabels[event.source] || "未知"}</span>
          <span class="badge">${escapeHtml(event.model)}</span>
          ${event.estimated ? `<span class="badge">含估算</span>` : `<span class="badge">真实 usage</span>`}
        </div>
        <div class="rows">
          <div class="row"><span>total</span><strong>${formatToken(event.totalTokens)}</strong></div>
          <div class="row"><span>active</span><strong>${formatToken(event.activeTokens)}</strong></div>
          <div class="row"><span>input / cached / output</span><strong>${formatToken(event.inputTokens)} / ${formatToken(event.cachedInputTokens)} / ${formatToken(event.outputTokens)}</strong></div>
          <div class="row"><span>records</span><strong>${formatInt(event.records)}</strong></div>
        </div>
      `;
      document.querySelector(`.event-card[data-index="${activeIndex}"]`)?.scrollIntoView({ block: "nearest" });
    }
    function renderLower(summary) {
      const tasks = Object.values(summary.tasks).sort((a, b) => b.totalTokens - a.totalTokens);
      const max = Math.max(...tasks.map(task => task.totalTokens), 1);
      els.taskBars.innerHTML = tasks.map(task => `
        <div class="bar">
          <strong>${escapeHtml(task.label)}</strong>
          <div class="track"><div class="fill" style="--w:${percent(task.totalTokens, max)}%;background:${task.color}"></div></div>
          <span>${formatToken(task.totalTokens)}</span>
        </div>
      `).join("") || `<div class="empty">暂无任务类型。</div>`;
      const peak = events.reduce((best, event) => event.totalTokens > (best?.totalTokens || 0) ? event : best, null);
      const topTask = tasks[0];
      const relayShare = percent(summary.sources.relay || 0, summary.totalTokens);
      els.summaryRows.innerHTML = `
        <div class="row"><span>主要任务</span><strong>${topTask ? topTask.label : "暂无"}</strong></div>
        <div class="row"><span>最高消耗事件</span><strong>${peak ? `${peak.timestamp.slice(5, 16).replace("T", " ")} / ${formatToken(peak.totalTokens)}` : "暂无"}</strong></div>
        <div class="row"><span>中转站占比</span><strong>${relayShare}%</strong></div>
        <div class="row"><span>输出 Token</span><strong>${formatToken(summary.outputTokens)}</strong></div>
      `;
    }
    function step() {
      if (!events.length) return;
      activeIndex = activeIndex >= events.length - 1 ? 0 : activeIndex + 1;
      render();
    }
    function setPlaying(value) {
      playing = value;
      els.playBtn.textContent = playing ? "暂停" : "播放";
      clearInterval(timer);
      if (playing) timer = setInterval(step, 1300 / speed);
    }
    function exportMarkdown() {
      const summary = summarize(events);
      const peak = events.reduce((best, event) => event.totalTokens > (best?.totalTokens || 0) ? event : best, null);
      const lines = [
        "# Codex Work Replay 总结",
        "",
        `- 范围：${els.rangeSelect.options[els.rangeSelect.selectedIndex].textContent}`,
        `- session 事件：${formatInt(summary.sessions)}`,
        `- 总 Token：${formatToken(summary.totalTokens)}`,
        `- active tokens：${formatToken(summary.activeTokens)}`,
        `- 缓存命中率：${percent(summary.cachedInputTokens, summary.inputTokens)}%`,
        `- 最高消耗事件：${peak ? `${peak.timestamp.slice(0, 16).replace("T", " ")} / ${peak.title} / ${formatToken(peak.totalTokens)}` : "暂无"}`,
        "",
        "## Top 事件",
        ...events.slice().sort((a, b) => b.totalTokens - a.totalTokens).slice(0, 10).map((event, index) => `${index + 1}. ${event.timestamp.slice(0, 16).replace("T", " ")} ${event.task.label} ${sourceLabels[event.source] || event.source} ${formatToken(event.totalTokens)} ${event.title}`)
      ];
      const blob = new Blob([lines.join("\n")], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `codex-work-replay-${todayString()}.md`;
      link.click();
      URL.revokeObjectURL(url);
    }
    els.playBtn.addEventListener("click", () => setPlaying(!playing));
    els.speedBtn.addEventListener("click", () => {
      speed = speed === 1 ? 2 : speed === 2 ? 4 : 1;
      els.speedBtn.textContent = `${speed}x`;
      if (playing) setPlaying(true);
    });
    els.rangeSelect.addEventListener("change", () => { activeIndex = 0; render(); });
    els.exportBtn.addEventListener("click", exportMarkdown);
    els.orbit.addEventListener("click", event => {
      const button = event.target.closest("[data-index]");
      if (!button) return;
      activeIndex = Number(button.dataset.index || 0);
      render();
    });
    els.timeline.addEventListener("click", event => {
      const button = event.target.closest("[data-index]");
      if (!button) return;
      activeIndex = Number(button.dataset.index || 0);
      render();
    });
    loadData().then(records => {
      rawRecords = records;
      render();
    }).catch(error => {
      els.sourceText.textContent = "数据加载失败";
      els.orbit.innerHTML = `<div class="empty">${escapeHtml(error.message || "无法读取数据，请回到主看板导入。")}</div>`;
    });
  </script>
</body>
</html>
