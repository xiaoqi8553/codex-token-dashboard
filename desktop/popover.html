<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TokenBar</title>
<style>
  :root {
    color-scheme: light dark;
    --panel-bg: rgba(250, 250, 252, 0.90);
    --panel-border: rgba(0, 0, 0, 0.09);
    --text: #1c1c1e;
    --text-2: rgba(60, 60, 67, 0.62);
    --text-3: rgba(60, 60, 67, 0.38);
    --track: rgba(120, 120, 128, 0.15);
    --accent: #5b5ce2;
    --accent-2: #8b5cf6;
    --warn: #f59e0b;
    --hair: rgba(0, 0, 0, 0.07);
    --hover: rgba(120, 120, 128, 0.11);
    --mark-bg: #1c1c1e;
    --mark-fg: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --panel-bg: rgba(28, 29, 34, 0.90);
      --panel-border: rgba(255, 255, 255, 0.11);
      --text: #f2f2f7;
      --text-2: rgba(235, 235, 245, 0.64);
      --text-3: rgba(235, 235, 245, 0.36);
      --track: rgba(255, 255, 255, 0.13);
      --hair: rgba(255, 255, 255, 0.09);
      --hover: rgba(255, 255, 255, 0.075);
      --mark-bg: #f2f2f7;
      --mark-fg: #1c1c1e;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: transparent;
    overflow: hidden;
  }

  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif;
    font-size: 13px;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
  }

  .panel {
    border-radius: 14px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.18), 0 2px 10px rgba(0, 0, 0, 0.10);
    backdrop-filter: blur(40px) saturate(180%);
    overflow: hidden;
    padding-bottom: 2px;
  }

  /* ---------------------------------------------------------------- header */

  .header {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 13px 16px 11px;
  }

  .mark {
    width: 27px;
    height: 27px;
    border-radius: 8px;
    background: var(--mark-bg);
    color: var(--mark-fg);
    display: grid;
    place-items: center;
    font: 600 12px/1 "Consolas", "SF Mono", monospace;
    letter-spacing: -0.5px;
    flex: none;
  }

  .head-text { flex: 1; min-width: 0; }

  .title {
    font-size: 14.5px;
    font-weight: 640;
    letter-spacing: -0.15px;
    line-height: 1.25;
  }

  .sub {
    font-size: 11.5px;
    color: var(--text-2);
    line-height: 1.35;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .plan {
    font-size: 11.5px;
    font-weight: 560;
    color: var(--text-2);
    padding: 2px 7px;
    border-radius: 5px;
    background: var(--hover);
    flex: none;
  }

  .plan:empty { display: none; }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: none;
    background: #34c759;
    box-shadow: 0 0 0 3px rgba(52, 199, 89, 0.15);
    transition: background 0.25s ease, box-shadow 0.25s ease;
  }

  .status-dot.warn {
    background: var(--warn);
    box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.17);
  }

  .status-dot.danger {
    background: #ff453a;
    box-shadow: 0 0 0 3px rgba(255, 69, 58, 0.17);
  }

  .status-dot.idle {
    background: var(--text-3);
    box-shadow: none;
  }

  /* ----------------------------------------------------------------- quota */

  .quota {
    padding: 0 16px 13px;
  }

  .quota-title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 7px;
  }

  .quota-name {
    font-size: 13px;
    font-weight: 620;
    letter-spacing: -0.1px;
  }

  .quota-window {
    font-size: 11px;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }

  .track {
    position: relative;
    height: 6px;
    border-radius: 3px;
    background: var(--track);
    overflow: hidden;
  }

  .fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width 0.75s cubic-bezier(0.22, 1, 0.36, 1), background 0.3s ease;
  }

  .fill.warn { background: linear-gradient(90deg, #f59e0b, #f97316); }
  .fill.danger { background: linear-gradient(90deg, #ff453a, #ef4444); }

  .quota-line {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-top: 6px;
    font-size: 12px;
    line-height: 1.35;
  }

  .used {
    color: var(--text);
    font-weight: 520;
    font-variant-numeric: tabular-nums;
  }

  .reset {
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  .pace {
    font-size: 11px;
    color: var(--text-3);
    line-height: 1.4;
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }

  .pace.warn { color: var(--warn); }

  /* ------------------------------------------------------------- structure */

  .rule {
    height: 1px;
    background: var(--hair);
    margin: 0 16px 12px;
  }

  /* ----------------------------------------------------------------- today */

  .today {
    padding: 0 16px 8px;
    display: flex;
    align-items: flex-end;
    gap: 12px;
  }

  .today-main { flex: 1; min-width: 0; }

  .today-label {
    font-size: 11px;
    color: var(--text-2);
    margin-bottom: 2px;
  }

  .today-value {
    font-size: 23px;
    font-weight: 660;
    letter-spacing: -0.7px;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  .today-value small {
    font-size: 12px;
    font-weight: 520;
    color: var(--text-2);
    letter-spacing: 0;
    margin-left: 3px;
  }

  .today-meta {
    font-size: 11.5px;
    color: var(--text-2);
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .spark {
    flex: none;
    color: var(--accent);
    opacity: 0.95;
    padding-bottom: 3px;
  }

  /* ------------------------------------------------------------ disclosure */

  .disclosure {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 16px;
    background: none;
    border: 0;
    color: var(--text);
    font: inherit;
    font-size: 12.5px;
    font-weight: 520;
    cursor: default;
    text-align: left;
  }

  .disclosure:hover { background: var(--hover); }

  .chev {
    width: 11px;
    height: 11px;
    color: var(--text-3);
    transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    flex: none;
  }

  .disclosure[aria-expanded="true"] .chev { transform: rotate(90deg); }

  .detail {
    padding: 2px 16px 10px;
  }

  .detail[hidden] { display: none; }

  .line {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    font-size: 12px;
    line-height: 1.75;
    color: var(--text-2);
  }

  .line b {
    color: var(--text);
    font-weight: 520;
    font-variant-numeric: tabular-nums;
  }

  /* --------------------------------------------------------------- actions */

  .actions {
    border-top: 1px solid var(--hair);
    margin-top: 6px;
    padding: 4px 0;
  }

  .action {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 16px;
    background: none;
    border: 0;
    color: var(--text);
    font: inherit;
    font-size: 13px;
    cursor: default;
    text-align: left;
  }

  .action:hover { background: var(--hover); }

  .action svg {
    width: 15px;
    height: 15px;
    flex: none;
    color: var(--text-2);
  }

  .action span { flex: 1; min-width: 0; }

  kbd {
    font: 500 10.5px/1 "Segoe UI", sans-serif;
    color: var(--text-3);
    padding: 2px 5px;
    border-radius: 4px;
    background: var(--hover);
    letter-spacing: 0.2px;
  }

  /* ---------------------------------------------------------------- footer */

  .footer {
    border-top: 1px solid var(--hair);
    margin-top: 4px;
    padding: 3px 0;
  }

  .row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 7px 16px;
    background: none;
    border: 0;
    color: var(--text);
    font: inherit;
    font-size: 12.5px;
    cursor: default;
    text-align: left;
  }

  button.row:hover { background: var(--hover); }

  .switch {
    width: 32px;
    height: 18px;
    border-radius: 9px;
    background: var(--track);
    position: relative;
    transition: background 0.2s ease;
    flex: none;
    cursor: default;
  }

  .switch::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .switch.on { background: var(--accent); }
  .switch.on::after { transform: translateX(14px); }

  body.syncing #sync svg { animation: spin 0.9s linear infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }

  body.booting .fill { opacity: 0.45; }
</style>
</head>
<body>
<div class="panel" id="panel">
  <div class="header">
    <div class="mark">&gt;_</div>
    <div class="head-text">
      <div class="title">Codex</div>
      <div class="sub" id="updated">正在读取本地会话…</div>
    </div>
    <div class="plan" id="plan"></div>
    <span class="status-dot idle" id="status-dot" title="额度状态"></span>
  </div>

  <div class="quota">
    <div class="quota-title">
      <span class="quota-name">会话额度</span>
      <span class="quota-window">5 小时窗口</span>
    </div>
    <div class="track"><span class="fill" id="fill-session"></span></div>
    <div class="quota-line">
      <span class="used" id="used-session">—</span>
      <span class="reset" id="reset-session">—</span>
    </div>
    <div class="pace" id="pace-session"></div>
  </div>

  <div class="quota">
    <div class="quota-title">
      <span class="quota-name">每周额度</span>
      <span class="quota-window">7 天窗口</span>
    </div>
    <div class="track"><span class="fill" id="fill-weekly"></span></div>
    <div class="quota-line">
      <span class="used" id="used-weekly">—</span>
      <span class="reset" id="reset-weekly">—</span>
    </div>
    <div class="pace" id="pace-weekly"></div>
  </div>

  <div class="rule"></div>

  <div class="today">
    <div class="today-main">
      <div class="today-label">今日用量</div>
      <div class="today-value" id="today-value">—</div>
      <div class="today-meta" id="today-meta">—</div>
    </div>
    <svg class="spark" id="spark" width="100" height="40" viewBox="0 0 100 40" aria-hidden="true"></svg>
  </div>

  <button class="disclosure" id="more" aria-expanded="false">
    <span>累计与明细</span>
    <svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>
  </button>
  <div class="detail" id="detail" hidden>
    <div class="line"><span>累计 tokens</span><b id="d-total">—</b></div>
    <div class="line"><span>含历史索引</span><b id="d-attributed">—</b></div>
    <div class="line"><span>输入 / 其中缓存</span><b id="d-input">—</b></div>
    <div class="line"><span>输出 / 其中推理</span><b id="d-output">—</b></div>
    <div class="line"><span>会话数 / 请求数</span><b id="d-count">—</b></div>
    <div class="line"><span>WorkBuddy 今日 / 累计</span><b id="d-wb">—</b></div>
    <div class="line"><span>等价花费（刊例价）</span><b id="d-cost">—</b></div>
  </div>

  <div class="actions">
    <button class="action" id="dashboard">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2.5" width="5" height="11" rx="1.2"/><rect x="9" y="2.5" width="5" height="6" rx="1.2"/></svg>
      <span>打开完整看板</span>
    </button>
    <button class="action" id="sync">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.7-3.97"/><path d="M13.6 2.4v3.2h-3.2"/></svg>
      <span>立即同步数据</span>
      <kbd>F5</kbd>
    </button>
    <button class="action" id="status">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.8 8.6h2.6l1.5-4 2.3 7 1.6-3h4.4"/></svg>
      <span>Codex 状态页</span>
    </button>
  </div>

  <div class="footer">
    <div class="row">
      <span>登录 Windows 时启动</span>
      <span class="switch" id="launch-switch"></span>
    </div>
    <button class="row" id="about">关于 TokenBar</button>
    <button class="row" id="quit">退出</button>
  </div>
</div>

<script>
(() => {
  const host = window.codexBar || {};
  const state = { status: null, syncing: false, detailOpen: false };
  const $ = id => document.getElementById(id);

  // ------------------------------------------------------------------ utils
  function formatMoney(cny) {
    const n = Number(cny);
    if (!Number.isFinite(n) || n <= 0) return "¥0";
    if (n < 1) return "¥" + n.toFixed(2);
    if (n < 10) return "¥" + n.toFixed(2).replace(/0$/, "");
    if (n < 1000) return "¥" + n.toFixed(0);
    if (n < 100000) return "¥" + Math.round(n).toLocaleString("zh-CN");
    return "¥" + (n / 10000).toFixed(n >= 1000000 ? 0 : 1) + "万";
  }

  function formatTokens(value) {
    const n = Number(value) || 0;
    if (n >= 1e9) return (n / 1e9).toFixed(n >= 1e10 ? 1 : 2) + "B";
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e8 ? 0 : 1).replace(/\.0$/, "") + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
    return String(n);
  }

  function splitTokens(value) {
    const n = Number(value) || 0;
    if (n >= 1e9) return { num: (n / 1e9).toFixed(n >= 1e10 ? 1 : 2).replace(/0+$/, "").replace(/\.$/, ""), unit: "B" };
    if (n >= 1e6) return { num: (n / 1e6).toFixed(n >= 1e8 ? 0 : 1).replace(/\.0$/, ""), unit: "M" };
    if (n >= 1e3) return { num: (n / 1e3).toFixed(1).replace(/\.0$/, ""), unit: "K" };
    return { num: String(n), unit: "" };
  }

  function relativeTime(iso) {
    if (!iso) return "暂无数据";
    const diff = Date.now() - new Date(iso).getTime();
    if (!Number.isFinite(diff) || diff < 0) return "刚刚更新";
    const minutes = Math.floor(diff / 60000);
    if (minutes < 1) return "刚刚更新";
    if (minutes < 60) return `${minutes} 分钟前更新`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours} 小时前更新`;
    return `${Math.floor(hours / 24)} 天前更新`;
  }

  function resetCountdown(resetsAt) {
    if (!resetsAt) return "重置时间未知";
    const ms = Number(resetsAt) * 1000 - Date.now();
    if (!Number.isFinite(ms)) return "重置时间未知";
    if (ms <= 0) return "即将重置";
    const totalMinutes = Math.floor(ms / 60000);
    const days = Math.floor(totalMinutes / 1440);
    const hours = Math.floor((totalMinutes % 1440) / 60);
    const minutes = totalMinutes % 60;
    if (days > 0) return `${days} 天 ${hours} 小时后重置`;
    if (hours > 0) return `${hours} 小时 ${minutes} 分后重置`;
    return `${minutes} 分钟后重置`;
  }

  function paceText(quotaWindow) {
    if (!quotaWindow || !quotaWindow.resetsAt || !quotaWindow.windowMinutes) return "";
    const end = quotaWindow.resetsAt * 1000;
    const start = end - quotaWindow.windowMinutes * 60000;
    const now = Date.now();
    if (now <= start) return "";
    const elapsedRatio = Math.min(1, (now - start) / (end - start));
    const usedRatio = quotaWindow.usedPercent / 100;
    const diff = Math.round((usedRatio - elapsedRatio) * 100);
    if (Math.abs(diff) < 3) return "消耗与时间进度基本同步";
    if (diff > 0) return `消耗快于时间进度 (+${diff}%) · 可能提前用尽`;
    return `消耗慢于时间进度 (${diff}%) · 可撑到重置`;
  }

  // ------------------------------------------------------------------ render
  function renderQuota(prefix, quotaWindow) {
    const fill = $(`fill-${prefix}`);
    const used = $(`used-${prefix}`);
    const reset = $(`reset-${prefix}`);
    const pace = $(`pace-${prefix}`);
    if (!fill) return;

    if (!quotaWindow) {
      fill.style.width = "0%";
      fill.className = "fill";
      used.textContent = "暂无额度数据";
      reset.textContent = "—";
      pace.textContent = "";
      pace.className = "pace";
      return;
    }

    const percent = Math.max(0, Math.min(100, quotaWindow.usedPercent));
    fill.style.width = `${percent}%`;
    fill.className = "fill" + (percent >= 90 ? " danger" : percent >= 70 ? " warn" : "");
    used.textContent = `${percent % 1 === 0 ? percent : percent.toFixed(1)}% 已用`;
    reset.textContent = resetCountdown(quotaWindow.resetsAt);

    const text = paceText(quotaWindow);
    pace.textContent = text;
    pace.className = "pace" + (/快于/.test(text) ? " warn" : "");
  }

  function renderSpark(series) {
    const svg = $("spark");
    if (!svg) return;
    const values = (series || []).map(item => Number(item.totalTokens) || 0);
    if (!values.length) {
      svg.innerHTML = "";
      return;
    }
    const max = Math.max(...values, 1);
    const slot = 100 / values.length;
    const barWidth = Math.max(2.4, slot - 2.4);
    const maxBar = 34;
    svg.innerHTML = values.map((value, index) => {
      const height = value > 0 ? Math.max(3, (value / max) * maxBar) : 2;
      const isLast = index === values.length - 1;
      const y = 40 - height;
      const x = index * slot + (slot - barWidth) / 2;
      // 今天还没过完，用半透明区分「进行中」与「已完成」
      const opacity = isLast ? 0.55 : 0.30 + (index / values.length) * 0.46;
      return `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${barWidth.toFixed(2)}" height="${height.toFixed(2)}" rx="1.5" fill="currentColor" opacity="${opacity.toFixed(2)}"/>`;
    }).join("");
  }

  function renderDetail(status) {
    const totals = status.totals || {};
    const today = status.today || {};
    const legacy = status.baseline;
    $("d-total").textContent = `${formatTokens(totals.totalTokens)} tokens`;
    const attributed = $("d-attributed");
    if (attributed) {
      attributed.textContent = legacy && legacy.totalTokens
        ? `${formatTokens(legacy.totalTokens)} / ${legacy.days} 天`
        : "—";
    }
    $("d-input").textContent = `${formatTokens(totals.inputTokens)} / ${formatTokens(totals.cachedInputTokens)}`;
    $("d-output").textContent = `${formatTokens(today.outputTokens)} / ${formatTokens(today.reasoningOutputTokens)}`;
    $("d-count").textContent = `${(status.sessions || 0).toLocaleString("zh-CN")} / ${(totals.records || 0).toLocaleString("zh-CN")}`;

    const wb = status.workbuddy;
    const wbNode = $("d-wb");
    if (wbNode) {
      wbNode.textContent = wb && wb.totals && wb.totals.totalTokens
        ? `${formatTokens(wb.today ? wb.today.totalTokens : 0)} / ${formatTokens(wb.totals.totalTokens)}`
        : "—";
      wbNode.title = wb && wb.totals
        ? `WorkBuddy ${wb.sessions || 0} 个会话 · ${(wb.totals.records || 0).toLocaleString("zh-CN")} 次调用 · 积分 ${wb.credits ? wb.credits.total.toFixed(0) : 0}`
        : "未检测到 WorkBuddy 日志";
    }

    // 等价花费：Codex 与 WorkBuddy 都是按 API 刊例价折算，不是实际扣费
    const costNode = $("d-cost");
    if (costNode) {
      const codexCost = status.cost;
      const wbCost = wb && wb.cost;
      if (codexCost || wbCost) {
        const parts = [];
        if (codexCost) parts.push(`Codex ${formatMoney(codexCost.cny)}`);
        if (wbCost) parts.push(`WorkBuddy ${formatMoney(wbCost.cny)}`);
        costNode.textContent = parts.join(" + ");
        const totalCny = (codexCost ? codexCost.cny : 0) + (wbCost ? wbCost.cny : 0);
        costNode.title = `合计 ${formatMoney(totalCny)} · 今日 ${formatMoney(
          (codexCost ? codexCost.todayCny : 0) + (wbCost ? wbCost.todayCny : 0)
        )} · 按官方 API 刊例价折算，非订阅实扣`;
      } else {
        costNode.textContent = "—";
        costNode.title = "打开完整看板后按价格表折算";
      }
    }
  }

  function render(status) {
    if (!status) return;
    state.status = status;
    const quota = status.quota || {};

    const building = status.phase === "fast" || status.phase === "full";
    $("updated").textContent = building ? "正在建立完整索引…" : relativeTime(status.updatedAt || status.lastEventAt);
    $("plan").textContent = quota.planType ? String(quota.planType).replace(/^\w/, c => c.toUpperCase()) : "";
    document.body.classList.toggle("booting", building);

    const dot = $("status-dot");
    const usedPercent = quota.session ? quota.session.usedPercent
      : quota.weekly ? quota.weekly.usedPercent : null;
    if (usedPercent === null || usedPercent === undefined) dot.className = "status-dot idle";
    else if (quota.limitReached || usedPercent >= 90) dot.className = "status-dot danger";
    else if (usedPercent >= 70) dot.className = "status-dot warn";
    else dot.className = "status-dot";

    renderQuota("session", quota.session);
    renderQuota("weekly", quota.weekly);

    const today = status.today || {};
    const split = splitTokens(today.totalTokens);
    $("today-value").innerHTML = `${split.num}${split.unit ? `<small>${split.unit} tokens</small>` : " tokens"}`;

    const cachedRate = today.inputTokens ? Math.round((today.cachedInputTokens / today.inputTokens) * 100) : 0;
    $("today-meta").textContent = today.records
      ? `请求 ${today.records.toLocaleString("zh-CN")} · 输出 ${formatTokens(today.outputTokens)} · 缓存 ${cachedRate}%`
      : "今天还没有产生请求";

    renderSpark(status.series);
    renderDetail(status);
  }

  // ------------------------------------------------------------------ layout
  function syncHeight() {
    if (typeof host.setHeight !== "function") return;
    requestAnimationFrame(() => {
      const panel = $("panel");
      if (!panel) return;
      host.setHeight(Math.ceil(panel.getBoundingClientRect().height) + 4);
    });
  }

  // ------------------------------------------------------------------ events
  function bind() {
    $("dashboard").addEventListener("click", () => { host.openDashboard && host.openDashboard(); });
    $("sync").addEventListener("click", () => { runSync(true); });
    $("status").addEventListener("click", () => { host.openStatusPage && host.openStatusPage(); });
    $("quit").addEventListener("click", () => { host.quit && host.quit(); });
    $("about").addEventListener("click", () => { host.openDashboard && host.openDashboard(); });

    $("more").addEventListener("click", () => {
      state.detailOpen = !state.detailOpen;
      $("more").setAttribute("aria-expanded", String(state.detailOpen));
      $("detail").hidden = !state.detailOpen;
      syncHeight();
    });

    $("launch-switch").addEventListener("click", async event => {
      const switchEl = event.currentTarget;
      const next = !switchEl.classList.contains("on");
      switchEl.classList.toggle("on", next);
      try { await host.setLaunchAtLogin(next); } catch { switchEl.classList.toggle("on", !next); }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") host.close && host.close();
      if (event.key === "F5") { event.preventDefault(); runSync(true); }
    });

    window.addEventListener("resize", syncHeight);

    if (typeof host.onStatus === "function") {
      host.onStatus(payload => {
        render(payload);
        syncHeight();
      });
    }
  }

  async function runSync() {
    if (!host.refresh || state.syncing) return;
    state.syncing = true;
    document.body.classList.add("syncing");
    try {
      const payload = await host.refresh();
      if (payload) render(payload);
    } catch {
      /* 主进程会推送最新状态 */
    } finally {
      state.syncing = false;
      document.body.classList.remove("syncing");
      syncHeight();
    }
  }

  // -------------------------------------------------------------------- init
  (async () => {
    bind();
    renderSpark(Array.from({ length: 14 }, () => ({ totalTokens: 0 })));
    syncHeight();
    try {
      const prefs = await host.getPrefs?.();
      if (prefs && prefs.launchAtLogin) $("launch-switch").classList.add("on");
    } catch { /* ignore */ }
    runSync();
    setInterval(() => { if (state.status) render(state.status); }, 20_000);
  })();
})();
</script>
</body>
</html>
