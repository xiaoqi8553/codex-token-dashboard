<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex Token · 用量看板</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f4f7;
    --panel: #ffffff;
    --panel-soft: #fafbfc;
    --line: #e7e8ee;
    --line-soft: #f0f1f5;
    --text: #16171b;
    --text-2: #555a67;
    --text-3: #8b90a0;
    --accent: #3f6ef0;
    --accent-2: #a9c0fb;
    --accent-3: #dbe5fe;
    --c-cached: #9db6fb;
    --c-input: #3f6ef0;
    --c-output: #f0a33c;
    --c-bar: #4a71e4;
    --warn: #d9822b;
    --ok: #1f9d63;
    --danger: #d9534f;
    --shadow: 0 1px 2px rgba(19, 24, 40, .05), 0 10px 28px rgba(19, 24, 40, .06);
    --radius: 14px;
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1013;
    --panel: #181920;
    --panel-soft: #1d1e26;
    --line: #292b34;
    --line-soft: #23252d;
    --text: #f1f2f6;
    --text-2: #a6abb9;
    --text-3: #6e7482;
    --accent: #5b84ff;
    --accent-2: #34508f;
    --accent-3: #22304f;
    --c-cached: #3f5c9e;
    --c-input: #7aa0ff;
    --c-output: #e8a850;
    --c-bar: #7392ff;
    --warn: #e0a04c;
    --ok: #38b57e;
    --danger: #e06c68;
    --shadow: 0 1px 2px rgba(0, 0, 0, .34), 0 12px 34px rgba(0, 0, 0, .38);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Microsoft YaHei UI", sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--text-3) 34%, transparent);
    border-radius: 8px;
    border: 3px solid transparent;
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--text-3) 55%, transparent); background-clip: padding-box; border: 3px solid transparent; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------------- 启动屏 ---------------- */

  .boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: var(--bg);
    z-index: 40;
    transition: opacity .28s ease;
  }

  .boot.done { opacity: 0; pointer-events: none; }

  .boot-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .boot-mark {
    width: 46px;
    height: 46px;
    border-radius: 13px;
    background: linear-gradient(160deg, #2b57d6, #3f6ef0);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 19px;
    font-weight: 650;
    letter-spacing: -.5px;
    box-shadow: 0 8px 24px rgba(63, 110, 240, .32);
  }

  .boot-text { color: var(--text-2); font-size: 13.5px; }
  .boot-hint { color: var(--text-3); font-size: 12.5px; }

  .boot-bar {
    width: 210px;
    height: 4px;
    border-radius: 4px;
    background: var(--line);
    overflow: hidden;
  }

  .boot-bar i {
    display: block;
    height: 100%;
    width: 12%;
    border-radius: 4px;
    background: var(--accent);
    transition: width .3s ease;
  }

  /* ---------------- 布局 ---------------- */

  .app {
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  .app[hidden] { display: none; }

  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 18px;
    background: color-mix(in srgb, var(--panel) 82%, transparent);
    border-bottom: 1px solid var(--line);
    backdrop-filter: saturate(140%) blur(10px);
    -webkit-app-region: drag;
  }

  .topbar button, .topbar .range { -webkit-app-region: no-drag; }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .brand-mark {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: linear-gradient(160deg, #2b57d6, #3f6ef0);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 14px;
    font-weight: 650;
    flex: none;
  }

  .brand-title { font-size: 15.5px; font-weight: 640; letter-spacing: -.2px; }
  .brand-sub { font-size: 12.5px; color: var(--text-3); }

  .spacer { flex: 1; }

  .range {
    display: flex;
    gap: 2px;
    padding: 2px;
    background: var(--line-soft);
    border-radius: 9px;
  }

  .range button {
    border: 0;
    background: transparent;
    color: var(--text-2);
    font: inherit;
    font-size: 13px;
    padding: 5px 12px;
    border-radius: 7px;
    cursor: pointer;
    transition: background .16s ease, color .16s ease;
  }

  .range button:hover { color: var(--text); }
  .range button[aria-pressed="true"] {
    background: var(--panel);
    color: var(--text);
    font-weight: 580;
    box-shadow: 0 1px 2px rgba(19, 24, 40, .1);
  }

  /* 卡片内的小号切换器 */
  .range.mini button { font-size: 12px; padding: 3px 9px; border-radius: 6px; }

  .icon-btn {
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text-2);
    cursor: pointer;
    transition: color .16s ease, border-color .16s ease, background .16s ease;
  }

  .icon-btn:hover { color: var(--text); border-color: color-mix(in srgb, var(--text-3) 50%, transparent); }
  .icon-btn[data-busy="1"] svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  main {
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 16px 16px;
  }

  .card-head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 12px;
  }

  .card-head h2 {
    margin: 0;
    font-size: 14.5px;
    font-weight: 620;
    letter-spacing: -.1px;
  }

  .card-head .sub {
    margin: 3px 0 0;
    font-size: 12.5px;
    color: var(--text-3);
  }

  .card-head .range { margin-left: auto; }

  .badge {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-3);
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--line-soft);
    white-space: nowrap;
  }

  /* ---------------- 额度卡片 ---------------- */

  .stat-row {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 12px;
  }

  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    min-width: 0;
  }

  .stat-top {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .stat-label {
    font-size: 13.5px;
    color: var(--text-2);
    font-weight: 560;
  }

  .stat-window {
    margin-left: auto;
    font-size: 11.5px;
    color: var(--text-3);
    padding: 2px 6px;
    border-radius: 5px;
    background: var(--line-soft);
  }

  .stat-value {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .stat-num {
    font-size: 30px;
    font-weight: 640;
    letter-spacing: -1px;
    line-height: 1.1;
  }

  .stat-unit { font-size: 13px; color: var(--text-3); }

  .meter {
    height: 5px;
    border-radius: 4px;
    background: var(--line-soft);
    overflow: hidden;
  }

  .meter i {
    display: block;
    height: 100%;
    border-radius: 4px;
    background: var(--accent);
    transition: width .45s cubic-bezier(.3, .8, .3, 1);
  }

  .meter i[data-level="high"] { background: var(--warn); }
  .meter i[data-level="full"] { background: var(--danger); }

  .stat-foot {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--text-3);
    min-height: 17px;
  }

  .stat-foot b { color: var(--text-2); font-weight: 560; }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ok);
    flex: none;
  }
  .dot[data-tone="warn"] { background: var(--warn); }
  .dot[data-tone="muted"] { background: var(--text-3); }

  /* 额度条上的时间进度刻度：柱子是「已用」，竖线是「时间过了多少」 */
  .meter { position: relative; overflow: visible; }
  .meter .pace {
    position: absolute;
    top: -3px;
    bottom: -3px;
    width: 2px;
    border-radius: 2px;
    background: color-mix(in srgb, var(--text-3) 62%, transparent);
  }

  .stat-hint {
    font-size: 12px;
    color: var(--text-3);
    line-height: 1.3;
    margin-top: -3px;
  }

  /* 版本徽标 */
  .ver {
    font-size: 11.5px;
    font-weight: 520;
    color: var(--text-3);
    background: var(--line-soft);
    border-radius: 5px;
    padding: 1px 6px;
    margin-left: 6px;
    text-decoration: none;
    vertical-align: 2px;
    cursor: pointer;
  }
  .ver:hover { color: var(--accent); background: var(--accent-3); }

  /* 金额：数字用等宽表格数字，避免「¥」和数字抖动 */
  .stat-num.money, .bar-money {
    font-variant-numeric: tabular-nums;
  }
  .stat-num.money { font-size: 28px; letter-spacing: -1.3px; }

  .price-link {
    color: var(--text-3);
    text-decoration: underline;
    text-decoration-color: color-mix(in srgb, var(--text-3) 45%, transparent);
    text-underline-offset: 2px;
    cursor: pointer;
  }
  .price-link:hover { color: var(--accent); }

  /* 区间概要条：把「一行小字」换成可读的指标 */
  .summary {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    background: var(--panel-soft);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .summary > div {
    padding: 8px 12px;
    border-left: 1px solid var(--line-soft);
    min-width: 0;
  }
  .summary > div:first-child { border-left: 0; }
  .summary .k { font-size: 11.5px; color: var(--text-3); }
  .summary .v {
    font-size: 16.5px;
    font-weight: 620;
    letter-spacing: -.3px;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .summary .v small { font-size: 12px; font-weight: 500; color: var(--text-3); margin-left: 5px; }

  /* ---------------- 趋势图 ---------------- */

  .chart-wrap {
    position: relative;
    width: 100%;
    height: 190px;
  }

  .chart-wrap svg { display: block; width: 100%; height: 100%; }

  .axis-text {
    fill: var(--text-3);
    font-size: 11.5px;
    font-family: inherit;
  }

  .grid-line {
    stroke: var(--line-soft);
    stroke-width: 1;
    stroke-dasharray: 3 5;
  }

  .legend {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 10px;
    font-size: 11.5px;
    color: var(--text-3);
  }

  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 9px; height: 9px; border-radius: 2.5px; display: inline-block; }

  .tip {
    position: absolute;
    z-index: 5;
    min-width: 148px;
    padding: 9px 11px;
    background: color-mix(in srgb, var(--panel) 96%, transparent);
    border: 1px solid var(--line);
    border-radius: 9px;
    box-shadow: 0 8px 24px rgba(19, 24, 40, .16);
    font-size: 11.5px;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -100%);
    transition: opacity .12s ease;
  }

  .tip.show { opacity: 1; }
  .tip-title { font-weight: 600; margin-bottom: 5px; color: var(--text); }
  .tip-row { display: flex; justify-content: space-between; gap: 14px; color: var(--text-2); }
  .tip-row b { font-weight: 560; color: var(--text); }

  .note {
    margin: 8px 0 0;
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--text-3);
    padding: 7px 10px;
    border-radius: 8px;
    background: var(--line-soft);
  }

  .note b { color: var(--text-2); font-weight: 560; }

  /* ---------------- 分布条 ---------------- */

  .cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    align-items: start;
  }

  .bars { display: flex; flex-direction: column; gap: 10px; }

  .bar-row { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; }

  .bar-name {
    font-size: 13.5px;
    color: var(--text-2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .bar-val { font-size: 12.5px; color: var(--text-3); }
  .bar-val b { color: var(--text); font-weight: 560; }
  .bar-extra { color: var(--text-3); }

  .bar-track {
    grid-column: 1 / -1;
    height: 6px;
    border-radius: 4px;
    background: var(--line-soft);
    overflow: hidden;
  }

  .bar-track i {
    display: block;
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 62%, var(--accent-3)));
    transition: width .4s cubic-bezier(.3, .8, .3, 1);
  }

  .empty {
    color: var(--text-3);
    font-size: 13px;
    padding: 10px 0;
  }

  /* ---------------- 时段图 ---------------- */

  .hours {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 96px;
  }

  .hour-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    height: 100%;
  }

  .hour-bar {
    width: 100%;
    margin-top: auto;
    border-radius: 3px;
    background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 58%, transparent));
    min-height: 2px;
    transition: background .16s ease;
  }

  .hour-col:hover .hour-bar { background: var(--accent); }

  .hour-label {
    font-size: 10.5px;
    color: var(--text-3);
    height: 12px;
  }

  /* ---------------- 会话表 ---------------- */

  .table-wrap {
    max-height: 244px;
    overflow-y: auto;
    border-radius: 10px;
    border: 1px solid var(--line-soft);
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }

  thead th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--panel-soft);
    color: var(--text-3);
    font-weight: 560;
    font-size: 12px;
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }

  tbody td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--line-soft);
    color: var(--text-2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: var(--panel-soft); }
  td.num { text-align: right; color: var(--text); font-weight: 540; }
  td.proj { color: var(--text); }
  .muted { color: var(--text-3); }

  .chip {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 5px;
    background: var(--accent-3);
    color: var(--accent);
    font-size: 11.5px;
    font-weight: 540;
  }

  /* ---------------- 底栏 ---------------- */

  .statusbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 18px;
    border-top: 1px solid var(--line);
    background: color-mix(in srgb, var(--panel) 82%, transparent);
    font-size: 12.5px;
    color: var(--text-3);
  }

  .statusbar .link {
    color: var(--text-2);
    background: none;
    border: 0;
    font: inherit;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
    text-decoration-color: color-mix(in srgb, var(--text-3) 45%, transparent);
    text-underline-offset: 2px;
  }

  .statusbar .link:hover { color: var(--accent); }

  @media (max-width: 1120px) {
    .stat-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .summary { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  @media (max-width: 860px) {
    .stat-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cols { grid-template-columns: 1fr; }
  }

  @media (max-width: 620px) {
    .stat-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="boot" id="boot">
  <div class="boot-card">
    <div class="boot-mark">&gt;_</div>
    <div class="boot-text" id="boot-text">正在读取本地会话日志…</div>
    <div class="boot-bar"><i id="boot-fill"></i></div>
    <div class="boot-hint" id="boot-hint">数据来自 ~/.codex/sessions 与 ~/.workbuddy/projects，不联网</div>
  </div>
</div>

<div class="app" id="app" hidden>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">&gt;_</div>
      <div>
        <div class="brand-title">Token 看板<a class="ver" id="app-ver" title="查看 GitHub 仓库">v—</a></div>
        <div class="brand-sub" id="brand-sub">本地用量看板</div>
      </div>
    </div>
    <div class="range source" id="source" role="group" aria-label="数据源">
      <button type="button" data-source="codex" aria-pressed="true">Codex</button>
      <button type="button" data-source="workbuddy" aria-pressed="false">WorkBuddy</button>
    </div>
    <div class="spacer"></div>
    <div class="range" id="range" role="group" aria-label="时间范围"></div>
    <button class="icon-btn" id="btn-refresh" title="重新扫描" aria-label="重新扫描">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
        <path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/>
      </svg>
    </button>
    <button class="icon-btn" id="btn-theme" title="切换深色模式" aria-label="切换深色模式">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z"/>
      </svg>
    </button>
  </header>

  <main>
    <section class="stat-row" id="stat-row"></section>

    <section class="card">
      <div class="card-head">
        <div>
          <h2>用量趋势</h2>
          <p class="sub" id="chart-sub">—</p>
        </div>
        <span class="badge" id="chart-badge">—</span>
      </div>
      <div class="summary" id="chart-summary"></div>
      <div class="chart-wrap">
        <svg id="chart" role="img" aria-label="每日 token 用量"></svg>
        <div class="tip" id="tip"></div>
      </div>
    </section>

    <div class="cols">
      <section class="card">
        <div class="card-head">
          <div><h2>模型分布</h2></div>
          <span class="badge" id="model-badge">—</span>
        </div>
        <div class="bars" id="models"></div>
      </section>
      <section class="card">
        <div class="card-head">
          <div><h2>项目分布</h2></div>
          <span class="badge" id="project-badge">—</span>
        </div>
        <div class="bars" id="projects"></div>
      </section>
    </div>

    <section class="card">
      <div class="card-head">
        <div><h2 id="hour-title">活跃时段</h2></div>
        <div class="range mini" id="hour-tabs" role="group" aria-label="时段指标">
          <button type="button" data-metric="tokens" aria-pressed="true">用量</button>
          <button type="button" data-metric="speed" aria-pressed="false">速度</button>
        </div>
      </div>
      <div class="hours" id="hours"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <div><h2>会话记录</h2></div>
        <span class="badge" id="session-badge">—</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width: 90px">最近活动</th>
              <th>项目</th>
              <th style="width: 146px">模型</th>
              <th style="width: 80px; text-align: right">用量</th>
              <th style="width: 60px; text-align: right">请求</th>
              <th style="width: 76px; text-align: right">花费</th>
              <th style="width: 66px; text-align: right" id="th-speed">速度</th>
              <th style="width: 74px; text-align: right">时长</th>
            </tr>
          </thead>
          <tbody id="session-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="statusbar">
    <span class="dot" id="status-dot"></span>
    <span id="status-text">—</span>
    <span style="flex:1"></span>
    <button class="link" id="btn-pricing">价格表</button>
    <button class="link" id="btn-sessions">日志目录</button>
    <button class="link" id="btn-legacy">旧版网页看板</button>
  </footer>
</div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // 状态
  // ---------------------------------------------------------------------
  const RANGES = [
    { key: 7, label: "7 天" },
    { key: 14, label: "14 天" },
    { key: 30, label: "30 天" },
    { key: 0, label: "全部" }
  ];

  const state = {
    /** 当前展示的数据源明细（等于 data[source]） */
    detail: null,
    /** 两个数据源各自缓存一份，切换时不用重新扫描 */
    data: { codex: null, workbuddy: null },
    source: localStorage.getItem("codex.source") === "workbuddy" ? "workbuddy" : "codex",
    status: null,
    meta: null,
    range: Number(localStorage.getItem("codex.range") || 14) || 14,
    hourMetric: localStorage.getItem("codex.hourMetric") || "tokens",
    theme: localStorage.getItem("codex.theme") || "auto",
    hover: -1
  };

  const $ = id => document.getElementById(id);

  // ---------------------------------------------------------------------
  // 格式化
  // ---------------------------------------------------------------------
  function fmtTokens(value) {
    const n = Number(value) || 0;
    // B 级统一两位小数：看板与弹窗并排出现时不会一个 5.75 一个 5.7
    if (n >= 1e9) return (n / 1e9).toFixed(n >= 1e10 ? 1 : 2) + "B";
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e8 ? 0 : 1).replace(/\.0$/, "") + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
    return String(Math.round(n));
  }

  function fmtCount(value) {
    return (Number(value) || 0).toLocaleString("zh-CN");
  }

  /**
   * 金额：人民币为主。
   * 小额给两位小数（单次调用几毛钱时四舍五入会变 0），上万用「万」，
   * 中间用千分位整数，读起来比 6 位数字快。
   */
  function fmtMoney(cny) {
    const n = Number(cny);
    if (!Number.isFinite(n) || n <= 0) return "¥0";
    if (n < 1) return "¥" + n.toFixed(2);
    if (n < 10) return "¥" + n.toFixed(2).replace(/0$/, "");
    if (n < 1000) return "¥" + n.toFixed(0);
    if (n < 100000) return "¥" + Math.round(n).toLocaleString("zh-CN");
    return "¥" + (n / 10000).toFixed(n >= 1000000 ? 0 : 1) + "万";
  }

  /** 美元：和人民币的口径是同一个数按汇率折算 */
  function fmtUsd(usd) {
    const n = Number(usd);
    if (!Number.isFinite(n) || n <= 0) return "$0";
    if (n < 1) return "$" + n.toFixed(2);
    if (n < 1000) return "$" + n.toFixed(n < 10 ? 2 : 0);
    if (n < 1000000) return "$" + Math.round(n).toLocaleString("en-US");
    return "$" + (n / 1000000).toFixed(2) + "M";
  }

  /** 某模型的每百万 tokens 单价（人民币），拿不到就用兜底价 */
  function unitFor(model) {
    const pricing = state.detail && state.detail.pricing;
    if (!pricing) return null;
    const cell = pricing.models && pricing.models[model];
    if (cell && cell.unit) return cell.unit;
    return pricing.fallback ? pricing.fallback.unit : null;
  }

  /** 单个桶按单价折算成人民币 */
  function bucketCost(bucket, unit) {
    if (!bucket || !unit) return 0;
    const input = Math.max(0, bucket.inputTokens || 0);
    const cached = Math.min(input, Math.max(0, bucket.cachedInputTokens || 0));
    const output = Math.max(0, bucket.outputTokens || 0);
    return ((input - cached) * unit.input + cached * unit.cached + output * unit.output) / 1e6;
  }

  /** 当前区间内、按模型单价逐天累加的花费 */
  function rangeCost() {
    const detail = state.detail;
    if (!detail || !detail.modelDays) return 0;
    const days = rangeDays();
    const keys = days === 0 ? Object.keys(detail.modelDays) : rangeSeries().map(item => item.day);
    let total = 0;
    for (const day of keys) {
      const byModel = detail.modelDays[day];
      if (!byModel) continue;
      for (const [model, bucket] of Object.entries(byModel)) {
        total += bucketCost(bucket, unitFor(model));
      }
    }
    return total;
  }

  /** 单价说明：鼠标停在模型行上能看到「输入 / 命中 / 输出」三档 */
  function unitText(model) {
    const unit = unitFor(model);
    if (!unit) return "";
    return "输入 ¥" + unit.input.toFixed(2) + " · 命中 ¥" + unit.cached.toFixed(2) +
      " · 输出 ¥" + unit.output.toFixed(2) + " / 百万 tokens";
  }

  function fmtPercent(value, digits) {
    const n = Number(value) || 0;
    return n.toFixed(digits === undefined ? 0 : digits) + "%";
  }

  function fmtDuration(ms) {
    if (!Number.isFinite(ms) || ms <= 0) return "—";
    const minutes = Math.floor(ms / 60000);
    if (minutes < 1) return "<1 分钟";
    const hours = Math.floor(minutes / 60);
    const days = Math.floor(hours / 24);
    if (days >= 1) return days + " 天 " + (hours % 24) + " 小时";
    if (hours >= 1) return hours + " 小时 " + (minutes % 60) + " 分";
    return minutes + " 分钟";
  }

  /** 秒级耗时：首字延迟、每轮耗时这类数字用 */
  function fmtSpeed(ms) {
    if (!Number.isFinite(ms) || ms < 0) return "—";
    if (ms < 1000) return Math.round(ms) + "ms";
    if (ms < 60000) return (ms / 1000).toFixed(ms < 10000 ? 1 : 0) + "s";
    return Math.round(ms / 60000) + " 分";
  }

  function relTime(iso) {
    if (!iso) return "—";
    const stamp = new Date(iso).getTime();
    if (Number.isNaN(stamp)) return "—";
    const diff = Date.now() - stamp;
    if (diff < 60e3) return "刚刚";
    if (diff < 3600e3) return Math.floor(diff / 60e3) + " 分钟前";
    if (diff < 86400e3) return Math.floor(diff / 3600e3) + " 小时前";
    const days = Math.floor(diff / 86400e3);
    if (days === 1) return "昨天";
    if (days < 7) return days + " 天前";
    const date = new Date(iso);
    return (date.getMonth() + 1) + " 月 " + date.getDate() + " 日";
  }
  function dayLabel(key) {
    const [, month, day] = String(key).split("-");
    return Number(month) + "/" + Number(day);
  }

  function localDayKey(date) {
    const pad = n => String(n).padStart(2, "0");
    return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate());
  }

  // ---------------------------------------------------------------------
  // 主题
  // ---------------------------------------------------------------------
  function applyTheme() {
    const dark = state.theme === "dark" || (state.theme === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  }

  // ---------------------------------------------------------------------
  // 区间数据
  // ---------------------------------------------------------------------
  function rangeDays() {
    return state.range > 0 ? state.range : 0;
  }

  /** 取区间内的每日序列，补齐没有用量的空白日 */
  function rangeSeries() {
    const detail = state.detail;
    if (!detail) return [];
    if (rangeDays() === 0) return detail.series.slice();

    const byDay = new Map(detail.series.map(item => [item.day, item]));
    const out = [];
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    for (let offset = rangeDays() - 1; offset >= 0; offset -= 1) {
      const date = new Date(today);
      date.setDate(date.getDate() - offset);
      const key = localDayKey(date);
      const found = byDay.get(key);
      out.push(found || {
        day: key,
        totalTokens: 0,
        inputTokens: 0,
        cachedInputTokens: 0,
        outputTokens: 0,
        records: 0
      });
    }
    return out;
  }

  /** 区间内的模型汇总（用 天×模型 维度重算，而不是全量占比） */
  function rangeModels() {
    const detail = state.detail;
    if (!detail) return [];
    const days = rangeDays();
    const keys = days === 0
      ? Object.keys(detail.modelDays || {})
      : rangeSeries().map(item => item.day);

    const totals = new Map();
    let grand = 0;
    for (const day of keys) {
      const byModel = (detail.modelDays || {})[day];
      if (!byModel) continue;
      for (const [model, bucket] of Object.entries(byModel)) {
        const current = totals.get(model) || {
          model,
          totalTokens: 0,
          inputTokens: 0,
          cachedInputTokens: 0,
          outputTokens: 0,
          records: 0
        };
        current.totalTokens += bucket.totalTokens || 0;
        current.inputTokens += bucket.inputTokens || 0;
        current.cachedInputTokens += bucket.cachedInputTokens || 0;
        current.outputTokens += bucket.outputTokens || 0;
        current.records += bucket.records || 0;
        totals.set(model, current);
        grand += bucket.totalTokens || 0;
      }
    }

    // 速度与用量走同一批天，避免「占比是 30 天、速度是全部时间」
    const speedDays = (detail.throughput && detail.throughput.modelDays) || {};
    const speedAcc = new Map();
    for (const day of keys) {
      const byModel = speedDays[day];
      if (!byModel) continue;
      for (const [model, cell] of Object.entries(byModel)) {
        const current = speedAcc.get(model) || { output: 0, duration: 0, turns: 0 };
        current.output += cell.outputTokens || 0;
        current.duration += cell.durationMs || 0;
        current.turns += cell.turns || 0;
        speedAcc.set(model, current);
      }
    }

    return [...totals.values()]
      .map(item => {
        const speed = speedAcc.get(item.model);
        return {
          ...item,
          share: grand ? item.totalTokens / grand : 0,
          turns: speed ? speed.turns : 0,
          tps: speed && speed.duration > 0 ? speed.output * 1000 / speed.duration : null
        };
      })
      .sort((a, b) => b.totalTokens - a.totalTokens);
  }

  /** 区间内的项目汇总 */
  function rangeProjects() {
    const detail = state.detail;
    if (!detail) return [];
    const days = rangeDays();
    const keys = days === 0
      ? Object.keys(detail.projectDays || {})
      : rangeSeries().map(item => item.day);

    const totals = new Map();
    let grand = 0;
    for (const day of keys) {
      const byProject = (detail.projectDays || {})[day];
      if (!byProject) continue;
      for (const [project, bucket] of Object.entries(byProject)) {
        const current = totals.get(project) || { project, totalTokens: 0, records: 0, sessions: 0 };
        current.totalTokens += bucket.totalTokens || 0;
        current.records += bucket.records || 0;
        totals.set(project, current);
        grand += bucket.totalTokens || 0;
      }
    }
    return [...totals.values()]
      .map(item => ({ ...item, share: grand ? item.totalTokens / grand : 0 }))
      .sort((a, b) => b.totalTokens - a.totalTokens);
  }

  // ---------------------------------------------------------------------
  // 渲染：额度
  // ---------------------------------------------------------------------
  function quotaPace(window_) {
    if (!window_ || !window_.windowMinutes || !window_.resetsAt) return null;
    const totalMs = window_.windowMinutes * 60 * 1000;
    const resetAt = window_.resetsAt * 1000;
    const elapsedMs = totalMs - (resetAt - Date.now());
    const elapsedPercent = Math.max(0, Math.min(100, (elapsedMs / totalMs) * 100));
    const delta = window_.usedPercent - elapsedPercent;
    let tone = "muted";
    let text = "节奏正常";
    if (delta > 5) {
      tone = "warn";
      text = "快于进度 " + Math.round(delta) + "%";
    } else if (delta < -5) {
      tone = "ok";
      text = "慢于进度 " + Math.round(-delta) + "%";
    }
    return { tone, text, remaining: resetAt - Date.now() };
  }

  function meterLevel(percent) {
    if (percent >= 95) return "full";
    if (percent >= 75) return "high";
    return "ok";
  }

  /** 某个时间窗口内实际消耗的 tokens：用小时桶累加，避免再扫一遍日志 */
  function windowTokens(startMs, endMs) {
    const hours = state.detail && state.detail.dailyHours;
    if (!hours || !Number.isFinite(startMs)) return null;
    const end = Number.isFinite(endMs) ? endMs : Date.now();
    const cursor = new Date(startMs);
    cursor.setMinutes(0, 0, 0);
    let total = 0;
    let seen = false;
    while (cursor.getTime() <= end) {
      const row = hours[localDayKey(cursor)];
      if (row) {
        total += row[cursor.getHours()] || 0;
        seen = true;
      }
      cursor.setHours(cursor.getHours() + 1);
    }
    return seen ? total : null;
  }

  function fmtClock(stamp) {
    const date = new Date(stamp);
    if (Number.isNaN(date.getTime())) return "—";
    const pad = value => String(value).padStart(2, "0");
    const clock = pad(date.getHours()) + ":" + pad(date.getMinutes());
    if (localDayKey(date) === localDayKey(new Date())) return clock;
    return (date.getMonth() + 1) + "/" + date.getDate() + " " + clock;
  }

  /**
   * 额度卡：已用百分比 + 剩余 + 本窗口真实消耗 + 重置时刻 + 节奏。
   * 只给一个百分比太单薄，看不出「这个窗口里到底花了多少」。
   */
  function quotaCard(title, fallbackWindow, quotaWindow) {
    const windowLabel = quotaWindow && quotaWindow.windowMinutes
      ? (quotaWindow.windowMinutes >= 1440
        ? Math.round(quotaWindow.windowMinutes / 1440) + " 天窗口"
        : Math.round(quotaWindow.windowMinutes / 60) + " 小时窗口")
      : fallbackWindow;

    if (!quotaWindow) {
      return {
        label: title,
        window: windowLabel,
        num: "—",
        unit: "",
        hideMeter: true,
        foot: "暂无配额快照",
        hints: ["跑一次 Codex 就能拿到额度"]
      };
    }

    const used = Math.max(0, Math.min(100, quotaWindow.usedPercent));
    const remaining = Math.max(0, 100 - used);
    const pace = quotaPace(quotaWindow);
    const totalMs = quotaWindow.windowMinutes ? quotaWindow.windowMinutes * 60000 : 0;
    const resetMs = quotaWindow.resetsAt ? quotaWindow.resetsAt * 1000 : null;
    const startMs = resetMs && totalMs ? resetMs - totalMs : null;
    const tokens = startMs ? windowTokens(startMs, Date.now()) : null;
    const elapsedPercent = startMs && resetMs
      ? Math.max(0, Math.min(100, ((totalMs - (resetMs - Date.now())) / totalMs) * 100))
      : null;

    const hints = [];
    if (tokens !== null) hints.push("窗口内 " + fmtTokens(tokens) + " tokens");
    if (resetMs) hints.push(fmtClock(resetMs) + " 重置");

    return {
      label: title,
      window: windowLabel,
      num: fmtPercent(used),
      unit: "已用",
      percent: used,
      pace: elapsedPercent,
      foot: [
        '<span class="dot" data-tone="' + (pace ? pace.tone : "muted") + '"></span>',
        "剩余 <b>" + fmtPercent(remaining) + "</b>",
        pace ? " · " + escapeHtml(pace.text) : ""
      ].join(""),
      hints
    };
  }

  function todayCard() {
    const detail = state.detail;
    const today = detail && detail.today ? detail.today : null;
    const total = today ? today.totalTokens : 0;
    const cacheRate = today && today.inputTokens ? (today.cachedInputTokens / today.inputTokens) * 100 : 0;

    // 用「昨日同一时刻之前」的用量做基准：今天还没过完，拿全天比会严重失真
    const nowHour = new Date().getHours();
    const yesterdayHours = detail && detail.dailyHours ? detail.dailyHours[previousDayKey()] : null;
    const yesterdaySameTime = Array.isArray(yesterdayHours)
      ? yesterdayHours.slice(0, nowHour + 1).reduce((acc, value) => acc + (value || 0), 0)
      : 0;
    let deltaText = "昨日同期无数据";
    if (yesterdaySameTime > 0) {
      const delta = ((total - yesterdaySameTime) / yesterdaySameTime) * 100;
      deltaText = "较昨日同期 " + (delta >= 0 ? "+" : "") + Math.round(delta) + "%";
    }

    const freshInput = today ? Math.max(0, today.inputTokens - today.cachedInputTokens) : 0;
    return {
      label: "今日用量",
      window: "00:00 起",
      num: today ? fmtTokens(total) : "—",
      unit: "tokens",
      hideMeter: true,
      foot: today
        ? "<b>" + fmtCount(today.records) + "</b> 次请求 · 缓存命中 <b>" + fmtPercent(cacheRate) + "</b>"
        : "今天还没有记录",
      hints: today
        ? [deltaText, "新增输入 " + fmtTokens(freshInput) + " · 输出 " + fmtTokens(today.outputTokens)]
        : []
    };
  }

  function speedCard() {
    const detail = state.detail;
    const speed = detail && detail.throughput;
    const todaySpeed = speed && speed.days ? speed.days[localDayKey(new Date())] : null;
    const recentSpeed = speed && detail.series
      ? (() => {
          const keys = detail.series.slice(-14).map(item => item.day);
          let out = 0, dur = 0, turns = 0;
          for (const key of keys) {
            const cell = speed.days[key];
            if (!cell) continue;
            out += cell.outputTokens;
            dur += cell.durationMs;
            turns += cell.turns;
          }
          return dur > 0 ? { tps: out * 1000 / dur, turns } : null;
        })()
      : null;

    const hints = [];
    if (recentSpeed) hints.push("近 14 天 " + recentSpeed.tps.toFixed(1) + " tok/s");
    if (todaySpeed && todaySpeed.ttftMs) hints.push("首字 " + fmtSpeed(todaySpeed.ttftMs));

    return {
      label: "输出速度",
      window: "整轮耗时口径",
      num: todaySpeed ? todaySpeed.tps.toFixed(1) : "—",
      unit: todaySpeed ? "tok/s" : "",
      hideMeter: true,
      foot: todaySpeed
        ? "<b>" + fmtCount(todaySpeed.turns) + "</b> 轮完成"
        : "今天还没有完成的轮次",
      hints
    };
  }

  /** 累计花费卡：token 折算成钱，回答「这些用量等于花了多少」 */
  function costCard() {
    const detail = state.detail;
    const cost = detail && detail.cost;
    if (!cost) {
      return {
        label: "等价花费",
        window: "API 刊例价",
        num: "—",
        unit: "",
        hideMeter: true,
        foot: "还没算过价格",
        hints: []
      };
    }
    const rate = Number(cost.rate) || 7.2;
    const days = detail.baseline && detail.baseline.days ? detail.baseline.days : detail.series.length;
    const totalTokens = detail.totals ? detail.totals.totalTokens : 0;
    const estimatedShare = totalTokens ? (cost.estimatedTokens || 0) / totalTokens : 0;

    return {
      label: "等价花费",
      window: "累计 " + days + " 天",
      num: fmtMoney(cost.cny),
      money: true,
      unit: "",
      hideMeter: true,
      // 详情都收进 tooltip：卡片上只留「多少钱 + 今日多少」
      title: fmtUsd(cost.usd) + " · 按 1 美元 ≈ " + rate.toFixed(2) + " 元折算" +
        (estimatedShare >= 0.005 ? " · 含 " + fmtPercent(estimatedShare * 100, 1) + " 估算用量" : ""),
      foot: "今日 <b>" + fmtMoney(cost.todayCny) + "</b> · " + fmtTokens(totalTokens) + " tokens",
      hints: detail.totals && detail.totals.records
        ? ["单次请求均摊 " + fmtMoney(cost.cny / detail.totals.records)]
        : []
    };
  }

  function workbuddyCards() {
    const detail = state.detail;
    const totals = detail.totals;
    const today = detail.today;
    const cacheRate = totals.inputTokens ? (totals.cachedInputTokens / totals.inputTokens) * 100 : 0;
    const todayRate = today && today.inputTokens ? (today.cachedInputTokens / today.inputTokens) * 100 : 0;
    const credits = detail.credits || { total: 0 };

    return [
      {
        label: "今日用量",
        window: "00:00 起",
        num: today ? fmtTokens(today.totalTokens) : "—",
        unit: "tokens",
        hideMeter: true,
        foot: today
          ? "<b>" + fmtCount(today.records) + "</b> 次调用 · 缓存 <b>" + fmtPercent(todayRate) + "</b>"
          : "今天还没有记录",
        hints: today
          ? ["输出 " + fmtTokens(today.outputTokens) + " · 推理 " + fmtTokens(today.reasoningOutputTokens)]
          : []
      },
      {
        label: "累计用量",
        window: detail.series.length + " 天",
        num: fmtTokens(totals.totalTokens),
        unit: "tokens",
        hideMeter: true,
        foot: "<b>" + fmtCount(totals.sessions) + "</b> 个会话 · <b>" + fmtCount(totals.records) + "</b> 次调用",
        hints: ["来源 ~/.workbuddy/projects"]
      },
      {
        label: "等价花费",
        window: "累计",
        num: fmtMoney(detail.cost ? detail.cost.cny : 0),
        money: true,
        unit: "",
        hideMeter: true,
        title: fmtUsd(detail.cost ? detail.cost.usd : 0) + " · 按 1 美元 ≈ " +
          ((detail.cost && detail.cost.rate) || 7.2).toFixed(2) + " 元折算",
        foot: "今日 <b>" + fmtMoney(detail.cost ? detail.cost.todayCny : 0) + "</b> · " + fmtTokens(totals.totalTokens) + " tokens",
        hints: []
      },
      {
        label: "积分消耗",
        window: "按调用累加",
        num: credits.total ? credits.total.toFixed(0) : "—",
        unit: "积分",
        hideMeter: true,
        foot: "今日 <b>" + (credits.today ? credits.today.toFixed(0) : "0") + "</b> 积分",
        hints: ["WorkBuddy 自己的计费口径"]
      },
      {
        label: "缓存命中率",
        window: "输入口径",
        num: fmtPercent(cacheRate, 1),
        unit: "命中",
        percent: cacheRate,
        level: "ok",

        hints: ["每轮重发上下文，命中越高越省"]

  function previousDayKey() {
    const date = new Date();
    date.setDate(date.getDate() - 1);
    return localDayKey(date);
  }

  // ---------------------------------------------------------------------
  // 渲染：趋势图
  // ---------------------------------------------------------------------
  function niceCeil(value) {
    if (value <= 0) return 1;
    const magnitude = Math.pow(10, Math.floor(Math.log10(value)));
    const scaled = value / magnitude;
    const steps = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
    for (const step of steps) {
      if (scaled <= step) return step * magnitude;
    }
    return 10 * magnitude;
  }

  /** 平滑曲线：Catmull-Rom 转三次贝塞尔；纵向夹紧，避免曲线冲出坐标区 */
  function smoothPath(points, top, bottom) {
    if (!points.length) return "";
    const head = "M " + points[0].x.toFixed(1) + " " + points[0].y.toFixed(1);
    if (points.length === 1) return head;
    const clamp = v => Math.max(top, Math.min(bottom, v));
    let d = head;
    for (let i = 0; i < points.length - 1; i += 1) {
      const p0 = points[i - 1] || points[i];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[i + 2] || p2;
      const c1x = p1.x + (p2.x - p0.x) / 6;
      const c1y = clamp(p1.y + (p2.y - p0.y) / 6);
      const c2x = p2.x - (p3.x - p1.x) / 6;
      const c2y = clamp(p2.y - (p3.y - p1.y) / 6);
      d += " C " + c1x.toFixed(1) + " " + c1y.toFixed(1) + ", " +
        c2x.toFixed(1) + " " + c2y.toFixed(1) + ", " +
        p2.x.toFixed(1) + " " + p2.y.toFixed(1);
    }
    return d;
  }

  function renderChart() {
    const svg = $("chart");
    const wrap = svg.parentElement;
    const width = Math.max(320, wrap.clientWidth);
    const height = 190;
    const padL = 40, padR = 12, padT = 16, padB = 24;
    const innerW = width - padL - padR;
    const innerH = height - padT - padB;
    const bottom = padT + innerH;

    const series = rangeSeries();
    if (!series.length) {
      svg.setAttribute("viewBox", "0 0 " + width + " " + height);
      svg.innerHTML = '<text x="' + (width / 2) + '" y="' + (height / 2) + '" text-anchor="middle" class="axis-text">暂无数据</text>';
      return;
    }

    let max = 0;
    for (const item of series) max = Math.max(max, item.totalTokens);
    const ceiling = niceCeil(max * 1.06 || 1);
    const step = series.length === 1 ? 0 : innerW / (series.length - 1);
    const xAt = index => (series.length === 1 ? padL + innerW / 2 : padL + index * step);
    const yAt = value => bottom - (Math.max(0, Math.min(value, ceiling)) / ceiling) * innerH;
    const todayKey = localDayKey(new Date());

    const parts = [];

    // 参考线只留 0 / 中 / 顶，且中间那条极淡
    for (let i = 0; i <= 2; i += 1) {
      const y = bottom - (innerH * i) / 2;
      if (i > 0) {
        parts.push('<line class="grid-line" x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (padL + innerW) + '" y2="' + y.toFixed(1) + '"/>');
      }
      parts.push('<text class="axis-text" x="' + (padL - 8) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' + fmtTokens((ceiling * i) / 2) + '</text>');
    }

    const points = series.map((item, index) => ({ x: xAt(index), y: yAt(item.totalTokens) }));
    const line = smoothPath(points, padT, bottom);
    const area = line +
      " L " + points[points.length - 1].x.toFixed(1) + " " + bottom.toFixed(1) +
      " L " + points[0].x.toFixed(1) + " " + bottom.toFixed(1) + " Z";

    parts.push('<defs>');
    parts.push('<linearGradient id="g-area" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="var(--accent)" stop-opacity="0.32"/>' +
      '<stop offset="70%" stop-color="var(--accent)" stop-opacity="0.08"/>' +
      '<stop offset="100%" stop-color="var(--accent)" stop-opacity="0.01"/>' +
      '</linearGradient>');
    parts.push('</defs>');

    parts.push('<path d="' + area + '" fill="url(#g-area)"/>');
    parts.push('<path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');

    // 今天：实心点；正在悬停：竖线 + 空心点
    const todayIndex = series.findIndex(item => item.day === todayKey);
    if (todayIndex >= 0) {
      parts.push('<circle cx="' + points[todayIndex].x.toFixed(1) + '" cy="' + points[todayIndex].y.toFixed(1) + '" r="3.2" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/>');
    }

    if (state.hover >= 0 && state.hover < series.length) {
      const hx = points[state.hover].x;
      parts.push('<line x1="' + hx.toFixed(1) + '" y1="' + padT + '" x2="' + hx.toFixed(1) + '" y2="' + bottom.toFixed(1) + '" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3" opacity="0.42" vector-effect="non-scaling-stroke"/>');
      parts.push('<circle cx="' + hx.toFixed(1) + '" cy="' + points[state.hover].y.toFixed(1) + '" r="4.2" fill="var(--panel)" stroke="var(--accent)" stroke-width="2.2"/>');
    }

    // X 轴：首、中、尾
    const labelIndexes = new Set([0, series.length - 1, Math.round((series.length - 1) / 2)]);
    const lastIndex = series.length - 1;
    series.forEach((item, index) => {
      if (!labelIndexes.has(index)) return;
      // 首尾对齐到绘图区边界：字号放大后居中会把日期切掉一半
      const anchor = series.length === 1 ? "middle" : index === 0 ? "start" : index === lastIndex ? "end" : "middle";
      const x = series.length === 1 ? xAt(index) : index === 0 ? padL : index === lastIndex ? padL + innerW : xAt(index);
      parts.push('<text class="axis-text" x="' + x.toFixed(1) + '" y="' + (height - 6) + '" text-anchor="' + anchor + '">' + dayLabel(item.day) + '</text>');
    });

    svg.setAttribute("viewBox", "0 0 " + width + " " + height);
    svg.removeAttribute("preserveAspectRatio");
    svg.innerHTML = parts.join("");

    // ------------------------------------------------------------------
    // 概要：四个指标横排，不再压成一行小字
    // ------------------------------------------------------------------
    const sumRange = series.reduce((acc, item) => acc + item.totalTokens, 0);
    const sumRecords = series.reduce((acc, item) => acc + item.records, 0);
    const activeDays = series.filter(item => item.totalTokens > 0).length || series.length;
    const avg = activeDays ? sumRange / activeDays : 0;
    const peak = series.reduce((acc, item) => (!acc || item.totalTokens > acc.totalTokens ? item : acc), null);

    const days = rangeDays();
    const firstDay = series[0].day;
    const lastDay = series[series.length - 1].day;
    $("chart-sub").textContent = (days === 0 ? "全部时间" : "最近 " + days + " 天") +
      " · " + dayLabel(firstDay) + " – " + dayLabel(lastDay) + " · " + series.length + " 天有记录";

    // 环比：跟紧挨着的前一段等长区间比
    let compareValue = "—";
    let compareNote = "缺少上一周期数据";
    const detail = state.detail;
    if (detail && detail.series) {
      if (days > 0) {
        const all = detail.series;
        const index = all.findIndex(item => item.day === firstDay);
        const prev = all.slice(Math.max(0, index - days), Math.max(0, index));
        const prevSum = prev.reduce((acc, item) => acc + item.totalTokens, 0);
        if (prevSum > 0) {
          const ratio = sumRange / prevSum;
          const delta = (ratio - 1) * 100;
          compareValue = delta >= 300 || delta <= -90
            ? "×" + ratio.toFixed(ratio >= 10 ? 0 : 1)
            : (delta >= 0 ? "+" : "") + Math.round(delta) + "%";
          compareNote = "上一周期 " + fmtTokens(prevSum) + " · 含历史索引";
        }
      } else {
        compareValue = series.length + " 天";
        compareNote = "最早 " + dayLabel(firstDay);
      }
    }

    // 区间花费：按区间内每天、每个模型各自的单价现算
    const costRange = rangeCost();
    const costRate = (detail && detail.cost && detail.cost.rate) || 7.2;

    const cells = [
      ["区间用量", fmtTokens(sumRange), series.length + " 天"],
      ["区间花费", fmtMoney(costRange), fmtUsd(costRange / costRate) + " · 刊例价"],
      ["日均", fmtTokens(avg), activeDays + " 天有记录 · " + fmtCount(sumRecords) + " 次请求"],
      ["单日峰值", peak ? fmtTokens(peak.totalTokens) : "—", peak ? dayLabel(peak.day) : ""],
      ["环比", compareValue, compareNote]
    ];
    $("chart-summary").innerHTML = cells.map(([label, value, note]) =>
      '<div><div class="k">' + label + '</div><div class="v">' + value +
      (note ? '<small>' + note + '</small>' : '') + '</div></div>'
    ).join("");

    $("chart-badge").textContent = state.source === "workbuddy" ? "WorkBuddy · 本地日志" : "Codex · 本地日志";
  }

  // 悬停提示
  function bindChartHover() {
    const svg = $("chart");
    const tip = $("tip");

    svg.addEventListener("mousemove", event => {
      const series = rangeSeries();
      if (!series.length) return;
      const rect = svg.getBoundingClientRect();
      const padL = 40, padR = 12;
      const innerW = rect.width - padL - padR;
      const step = series.length === 1 ? 0 : innerW / (series.length - 1);
      const x = event.clientX - rect.left - padL;
      const index = step ? Math.max(0, Math.min(series.length - 1, Math.round(x / step))) : 0;
      if (index !== state.hover) {
        state.hover = index;
        renderChart();
      }
      const item = series[index];
      const cached = Math.max(0, item.cachedInputTokens);
      const uncached = Math.max(0, (item.inputTokens || 0) - cached);
      const speed = state.detail && state.detail.throughput ? state.detail.throughput.days[item.day] : null;
      tip.innerHTML = [
        '<div class="tip-title">' + item.day + (item.day === localDayKey(new Date()) ? " · 今天" : "") + '</div>',
        '<div class="tip-row"><span>合计</span><b>' + fmtTokens(item.totalTokens) + '</b></div>',
        '<div class="tip-row"><span>缓存命中</span><b>' + fmtTokens(cached) + '</b></div>',
        '<div class="tip-row"><span>输入</span><b>' + fmtTokens(uncached) + '</b></div>',
        '<div class="tip-row"><span>输出</span><b>' + fmtTokens(item.outputTokens) + '</b></div>',
        '<div class="tip-row"><span>请求</span><b>' + fmtCount(item.records) + '</b></div>',
        speed && speed.tps ? '<div class="tip-row"><span>速度</span><b>' + speed.tps.toFixed(1) + ' tok/s</b></div>' : ''
      ].join("");
      const px = step ? padL + index * step : padL + innerW / 2;
      tip.style.left = Math.min(Math.max(px, 90), rect.width - 90) + "px";
      tip.style.top = (event.clientY - rect.top - 12) + "px";
      tip.classList.add("show");
    });

    svg.addEventListener("mouseleave", () => {
      tip.classList.remove("show");
      if (state.hover !== -1) {
        state.hover = -1;
        renderChart();
      }
    });
  }

  // ---------------------------------------------------------------------
  // 渲染：分布
  // ---------------------------------------------------------------------
  function renderBars(container, items, options) {
    const limit = options.limit || 6;
    const nameKey = options.nameKey;
    const emptyText = options.empty;

    if (!items.length) {
      container.innerHTML = '<div class="empty">' + emptyText + '</div>';
      return;
    }

    const head = items.slice(0, limit);
    const rest = items.slice(limit);
    const rows = head.slice();

    if (rest.length) {
      rows.push({
        [nameKey]: "其他 " + rest.length + " 项",
        totalTokens: rest.reduce((acc, item) => acc + item.totalTokens, 0),
        share: rest.reduce((acc, item) => acc + item.share, 0),
        muted: true
      });
    }

    const max = Math.max.apply(null, rows.map(item => item.share).concat([0.0001]));

    container.innerHTML = rows.map(item => {
      const width = Math.max(1.5, (item.share / max) * 100);
      return [
        '<div class="bar-row"' + (item.label ? ' title="' + escapeHtml(item.label) + '"' : '') + '>',
        '  <span class="bar-name"' + (item.muted ? ' style="color: var(--text-3)"' : '') + '>' + escapeHtml(item[nameKey]) + '</span>',
        '  <span class="bar-val"><b>' + fmtPercent(item.share * 100, 1) + '</b> · ' + fmtTokens(item.totalTokens) +
          (item.extra ? ' · <span class="bar-extra">' + escapeHtml(item.extra) + '</span>' : '') + '</span>',
        '  <span class="bar-track"><i style="width:' + width.toFixed(1) + '%"></i></span>',
        '</div>'
      ].join("");
    }).join("");
  }

  function escapeHtml(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderModels() {
    const models = rangeModels();
    for (const item of models) {
      const cost = bucketCost(item, unitFor(item.model));
      item.cost = cost;
      // 行尾先给钱（这是最想看的），速度并入 tooltip，避免撑爆一行
      item.extra = fmtMoney(cost);
      item.label = (item.tps ? item.tps.toFixed(1) + " tok/s · " : "") + unitText(item.model);
    }
    renderBars($("models"), models, { nameKey: "model", limit: 6, empty: "此区间没有模型数据" });
    const totalCost = models.reduce((acc, item) => acc + (item.cost || 0), 0);
    $("model-badge").textContent = fmtMoney(totalCost) + " · " +
      (rangeDays() === 0 ? "全部时间" : "最近 " + rangeDays() + " 天");
  }

  function renderProjects() {
    const projects = rangeProjects();
    renderBars($("projects"), projects, { nameKey: "project", limit: 6, empty: "此区间没有项目数据" });
    $("project-badge").textContent = rangeDays() === 0 ? "全部时间" : "最近 " + rangeDays() + " 天";
  }

  function renderHours() {
    const detail = state.detail;
    const container = $("hours");
    if (!detail) {
      container.innerHTML = "";
      return;
    }
    const hasSpeed = Boolean(detail.throughput);
    const speedMode = hasSpeed && state.hourMetric === "speed";
    $("hour-tabs").hidden = !hasSpeed;
    $("hour-title").textContent = speedMode ? "活跃时段 · tok/s" : "活跃时段";
    const days = rangeSeries().map(item => item.day);
    const values = new Array(24).fill(0);
    const turns = new Array(24).fill(0);

    if (speedMode) {
      // 每小时的完成轮速度：输出 tokens ÷ 耗时，按当前区间逐天累加
      const acc = Array.from({ length: 24 }, () => ({ output: 0, duration: 0, turns: 0 }));
      const byDay = (detail.throughput && detail.throughput.dayHours) || {};
      for (const day of days) {
        const cells = byDay[day];
        if (!cells) continue;
        cells.forEach((cell, hour) => {
          if (!cell || !cell.durationMs) return;
          acc[hour].output += cell.outputTokens;
          acc[hour].duration += cell.durationMs;
          acc[hour].turns += cell.turns;
        });
      }
      acc.forEach((cell, hour) => {
        values[hour] = cell.duration > 0 ? cell.output * 1000 / cell.duration : 0;
        turns[hour] = cell.turns;
      });
    } else {
      const byDay = detail.dailyHours || {};
      for (const day of days) {
        const row = byDay[day];
        if (!row) continue;
        for (let hour = 0; hour < 24; hour += 1) values[hour] += row[hour] || 0;
      }
    }

    const max = Math.max.apply(null, values.concat([0.0001]));
    container.innerHTML = values.map((value, hour) => {
      const ratio = max > 0 ? value / max : 0;
      const height = value > 0 ? Math.max(3, ratio * 72) : 2;
      const title = speedMode
        ? hour + ":00 · " + value.toFixed(1) + " tok/s · " + turns[hour] + " 轮"
        : hour + ":00 · " + fmtTokens(value) + " tokens";
      const style = value > 0
        ? "height:" + height.toFixed(1) + "px;opacity:" + (0.4 + ratio * 0.6).toFixed(2)
        : "height:2px;background:var(--line)";
      return [
        '<div class="hour-col" title="' + title + '">',
        '  <div class="hour-bar" style="' + style + '"></div>',
        '  <div class="hour-label">' + (hour % 3 === 0 ? hour : "") + '</div>',
        '</div>'
      ].join("");
    }).join("");
  }

  function renderSessions() {
    const detail = state.detail;
    const body = $("session-body");
    if (!detail || !detail.sessionList.length) {
      body.innerHTML = '<tr><td colspan="8" class="empty">暂无会话记录</td></tr>';
      $("session-badge").textContent = "0";
      return;
    }

    const isWorkBuddy = detail.source === "workbuddy";
    $("th-speed").textContent = isWorkBuddy ? "积分" : "速度";
    $("session-badge").textContent = detail.sessions + " 个会话";

    const rows = detail.sessionList.slice(0, 60);
    body.innerHTML = rows.map(item => {
      const models = item.models && item.models.length ? item.models : ["—"];
      const span = item.firstAt && item.lastAt ? new Date(item.lastAt).getTime() - new Date(item.firstAt).getTime() : 0;
      return [
        '<tr>',
        '  <td class="muted" title="' + escapeHtml(item.lastAt || "") + '">' + relTime(item.lastAt) + '</td>',
        '  <td class="proj" title="' + escapeHtml(item.cwd || "") + '">' + escapeHtml(item.project) + '</td>',
        '  <td><span class="chip">' + escapeHtml(models[0]) + '</span>' + (models.length > 1 ? ' <span class="muted">+' + (models.length - 1) + '</span>' : '') + '</td>',
        '  <td class="num">' + fmtTokens(item.totalTokens) + '</td>',
        '  <td class="num">' + fmtCount(item.records) + '</td>',
        '  <td class="num bar-money">' + (item.cost ? fmtMoney(item.cost) : '<span class="muted">—</span>') + '</td>',
        '  <td class="num">' + (isWorkBuddy
          ? (item.credit ? item.credit.toFixed(1) : '<span class="muted">—</span>')
          : (item.tps ? item.tps.toFixed(1) : '<span class="muted">—</span>')) + '</td>',
        '  <td class="num muted">' + fmtDuration(span) + '</td>',
        '</tr>'
      ].join("");
    }).join("");
  }

  function renderStatus() {
    const detail = state.detail;
    const dot = $("status-dot");
    if (!detail) {
      $("status-text").textContent = "正在读取本地会话日志…";
      return;
    }
    dot.setAttribute("data-tone", detail.builtAt ? "" : "muted");
    $("status-text").textContent =
      (detail.source === "workbuddy" ? "WorkBuddy · " : "Codex · ") +
      detail.scannedFiles + " 个日志 · " + detail.sessions + " 个会话 · " +
      (detail.builtAt ? new Date(detail.builtAt).toLocaleString("zh-CN", { hour12: false }) : "—");

    const legacyDays = detail.baseline && detail.baseline.days ? detail.baseline.days : detail.series.length;
    if (detail.source === "workbuddy") {
      const todayTokens = detail.today ? detail.today.totalTokens : 0;
      $("brand-sub").textContent = "累计 " + fmtTokens(detail.totals.totalTokens) +
        (detail.cost ? " ≈ " + fmtMoney(detail.cost.cny) : "") +
        " · " + legacyDays + " 天" +
        (legacyDays > 1 && todayTokens > 0 ? " · 今日 " + fmtTokens(todayTokens) : "");
    } else {
      const wbToday = workbuddyTodayTokens();
      $("brand-sub").textContent = "累计 " + fmtTokens(detail.totals.totalTokens) +
        (detail.cost ? " ≈ " + fmtMoney(detail.cost.cny) : "") +
        (legacyDays ? " · " + legacyDays + " 天" : "") +
        (wbToday > 0 ? " · WorkBuddy " + fmtTokens(wbToday) + " 今日" : "");
    }
  }

  function renderAll() {
    renderStats();
    renderChart();
    renderModels();
    renderProjects();
    renderHours();
    renderSessions();
    renderStatus();
  }

  // ---------------------------------------------------------------------
  // 交互
  // ---------------------------------------------------------------------
  function buildRangeTabs() {
    const container = $("range");
    container.innerHTML = RANGES.map(item =>
      '<button type="button" data-key="' + item.key + '" aria-pressed="' + (item.key === state.range) + '">' + item.label + '</button>'
    ).join("");
    container.addEventListener("click", event => {
      const button = event.target.closest("button[data-key]");
      if (!button) return;
      state.range = Number(button.dataset.key);
      localStorage.setItem("codex.range", String(state.range));
      for (const node of container.querySelectorAll("button")) {
        node.setAttribute("aria-pressed", String(Number(node.dataset.key) === state.range));
      }
      renderChart();
      renderModels();
      renderProjects();
      renderHours();
    });
  }

  function buildHourTabs() {
    const container = $("hour-tabs");
    for (const node of container.querySelectorAll("button")) {
      node.setAttribute("aria-pressed", String(node.dataset.metric === state.hourMetric));
    }
    container.addEventListener("click", event => {
      const button = event.target.closest("button");
      if (!button || button.dataset.metric === state.hourMetric) return;
      state.hourMetric = button.dataset.metric;
      localStorage.setItem("codex.hourMetric", state.hourMetric);
      for (const node of container.querySelectorAll("button")) {
        node.setAttribute("aria-pressed", String(node.dataset.metric === state.hourMetric));
      }
      renderHours();
    });
  }

  /** WorkBuddy 今日用量：优先用弹窗快照，没有就退回明细 */
  function workbuddyTodayTokens() {
    const fromStatus = state.status && state.status.workbuddy && state.status.workbuddy.today;
    if (fromStatus && fromStatus.totalTokens) return fromStatus.totalTokens;
    const detail = state.data.workbuddy;
    return detail && detail.today ? detail.today.totalTokens : 0;
  }

  function applySourceTabs() {
    for (const node of $("source").querySelectorAll("button")) {
      node.setAttribute("aria-pressed", String(node.dataset.source === state.source));
    }
  }

  function buildSourceTabs() {
    applySourceTabs();
    $("source").addEventListener("click", event => {
      const button = event.target.closest("button[data-source]");
      if (!button || button.dataset.source === state.source) return;
      state.source = button.dataset.source;
      localStorage.setItem("codex.source", state.source);
      applySourceTabs();
      state.hover = -1;
      if (state.data[state.source]) {
        state.detail = state.data[state.source];
        renderAll();
        return;
      }
      $("status-text").textContent = state.source === "workbuddy" ? "正在读取 WorkBuddy 日志…" : "正在读取 Codex 日志…";
      loadSource(state.source).then(() => {
        state.detail = state.data[state.source];
        renderAll();
      }).catch(error => {
        $("status-text").textContent = "读取失败：" + (error && error.message ? error.message : error);
      });
    });
  }

  async function loadSource(source, { refresh } = {}) {
    const api = window.dashboard;
    let detail;
    if (source === "workbuddy") {
      if (!api.workbuddyDetail) throw new Error("当前版本不支持 WorkBuddy 数据源");
      detail = refresh && api.workbuddyRefresh ? await api.workbuddyRefresh() : await api.workbuddyDetail();
      if (!detail) throw new Error("WorkBuddy 数据层尚未初始化");
      state.data.workbuddy = detail;
    } else {
      detail = refresh ? await api.refresh() : await api.getDetail();
      state.data.codex = detail;
    }
    return detail;
  }

  async function load({ refresh } = {}) {
    const button = $("btn-refresh");
    button.dataset.busy = "1";
    try {
      await loadSource("codex", { refresh });
      if (state.source === "workbuddy") {
        $("status-text").textContent = "正在读取 WorkBuddy 日志…";
        await loadSource("workbuddy", { refresh }).catch(() => {});
      }
      try {
        state.status = await window.dashboard.getStatus();
      } catch {
        /* 配额快照拿不到不影响其余部分 */
      }
      state.detail = state.data[state.source] || state.data.codex;
      $("app").hidden = false;
      renderAll();
      hideBoot();
      // 后台预热另一个数据源，切换时不用等扫描
      const other = state.source === "workbuddy" ? "codex" : "workbuddy";
      if (!state.data[other]) {
        loadSource(other).then(() => {
          if (state.source === other) {
            state.detail = state.data[other];
            renderAll();
          } else {
            renderStatus();
          }
        }).catch(() => {});
      }
    } catch (error) {
      $("boot-text").textContent = "读取失败：" + (error && error.message ? error.message : error);
      $("boot-hint").textContent = "请确认 ~/.codex/sessions 与 ~/.workbuddy/projects 目录存在";
    } finally {
      button.dataset.busy = "0";
    }
  }

  function hideBoot() {
    const boot = $("boot");
    if (boot.classList.contains("done")) return;
    boot.classList.add("done");
    setTimeout(() => { boot.style.display = "none"; }, 320);
  }

  function bindButtons() {
    $("btn-refresh").addEventListener("click", () => load({ refresh: true }));
    $("btn-theme").addEventListener("click", () => {
      state.theme = state.theme === "dark" ? "light" : state.theme === "light" ? "auto" : "dark";
      localStorage.setItem("codex.theme", state.theme);
      applyTheme();
      renderAll();
    });
    $("btn-sessions").addEventListener("click", () => {
      if (state.source === "workbuddy" && window.dashboard.openWorkBuddy) window.dashboard.openWorkBuddy();
      else window.dashboard.openSessions();
    });
    $("btn-legacy").addEventListener("click", () => window.dashboard.openLegacy());
    // 价格表：直接在系统默认编辑器里打开 pricing.json，改完重开看板即生效
    $("btn-pricing").addEventListener("click", () => {
      if (window.dashboard.openPricing) window.dashboard.openPricing();
    });
    // 版本号可点：直接在浏览器打开仓库，方便确认「这是哪一版」
    $("app-ver").addEventListener("click", () => {
      const repo = state.meta && state.meta.repo;
      if (repo && window.dashboard.openExternal) window.dashboard.openExternal(repo);
    });
  }

  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (state.detail) renderChart();
    }, 120);
  });

  // ---------------------------------------------------------------------
  // 启动
  // ---------------------------------------------------------------------
  applyTheme();
  buildRangeTabs();
  buildHourTabs();
  buildSourceTabs();
  bindButtons();
  bindChartHover();

  if (window.dashboard) {
    window.dashboard.onProgress(progress => {
      if (!progress || !progress.total) return;
      const percent = Math.max(6, Math.round((progress.index / progress.total) * 100));
      $("boot-fill").style.width = percent + "%";
      $("boot-text").textContent = "正在解析日志 " + progress.index + " / " + progress.total;
    });
    window.dashboard.getMeta().then(meta => {
      state.meta = meta;
      if (meta && meta.version) $("app-ver").textContent = "v" + meta.version;
    }).catch(() => {});
    window.dashboard.getStatus().then(status => {
      state.status = status;
      if (status) renderStats();
    }).catch(() => {});
    load().catch(() => {});
  } else {
    $("boot-text").textContent = "桥接未加载：请通过桌面应用启动";
  }
})();
</script>
</body>
</html>
