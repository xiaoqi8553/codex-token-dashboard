<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
    <title>Notion 文件夹导入说明</title>
  <style>
    :root { color-scheme: light dark; font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f3f6fa; color: #17202e; }
    main { width: min(100%, 520px); padding: 28px; border: 1px solid #d7e0ea; border-radius: 16px; background: white; box-shadow: 0 14px 40px #17202e14; }
    h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.25; }
    p { color: #52647c; }
    button { min-height: 46px; padding: 10px 18px; border: 0; border-radius: 9px; background: #275dcc; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    a { display: inline-block; padding: 10px 18px; border-radius: 9px; background: #275dcc; color: white; font-weight: 700; text-decoration: none; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    #message { min-height: 26px; margin: 16px 0 0; }
    .privacy { padding: 12px 14px; border-radius: 9px; background: #f3f6fa; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      body { background: #101820; color: #edf3fb; }
      main { background: #17212b; border-color: #2a3a4b; }
      p { color: #a8b8cb; }
      .privacy { background: #202d39; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Notion 文件夹导入</h1>
    <p>Notion 嵌入可能会切断此授权页与看板之间的连接，因此不能在此页完成持续文件夹授权。</p>
    <p>请关闭此页，回到看板并使用“一次性兼容导入”。如果要持续同步，请在普通 Chrome 标签页打开看板并重新选择 `.codex` 根目录。</p>
    <a href="https://xiaoqi8553.github.io/codex-token-dashboard/" target="_blank" rel="noopener">在独立标签页打开看板</a>
    <p class="privacy">会话内容留在本机，不会上传。独立标签页的自动更新不会回传到 Notion 嵌入块。</p>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <script>
    const message = document.querySelector("#message");
    message.textContent = "可以关闭此页并返回看板。";
  </script>
</body>
</html>
